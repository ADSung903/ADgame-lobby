<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>女巫毒藥｜遊隙</title><link rel="stylesheet" href="../assets/nook-material.css?v=2"><link rel="stylesheet" href="witch-v2.css"></head><body class="nook-material"><main class="app"><nav class="nook-breadcrumb"><a href="../index.html">遊隙 PLAY NOOK</a><span>／ 女巫毒藥</span></nav><section class="screen active" id="setup-screen"><h1>女巫毒藥</h1><p class="lead">兩個人，一張藥劑桌。藏好秘密，讀懂對手。</p><div class="setup-box"><div class="form-row"><label>玩家 1<input id="n1" maxlength="14" placeholder="玩家 1"></label><label>玩家 2<input id="n2" maxlength="14" placeholder="玩家 2"></label></div><div class="form-row"><label>每人藥瓶數<select id="bottles"><option>6</option><option>9</option><option>12</option><option>18</option></select></label><label>每人毒藥數<select id="poisons"><option>1</option><option>2</option><option>3</option></select></label></div><div class="rules">① 輪流秘密挑選自己的毒藥，再確認藏好。<br>② 每次交接都先遮住桌面，按「我準備好了」才揭開。<br>③ 輪流從對手桌上選一瓶，讓對手喝下；找到毒藥的人獲勝。</div><button class="start-btn" id="start">入座配藥 →</button></div></section><section class="screen handoff" id="handoff"><div class="seal">PRIVATE / 秘密交接</div><h2 id="handoff-name"></h2><p id="handoff-step"></p><button class="start-btn" id="ready">我準備好了</button></section><section class="screen" id="table-screen"><div class="turn-top"><h2 id="turn-title"></h2><span class="turn-count" id="turn-count"></span></div><div class="table"><div class="potions" id="potions"></div></div><div class="action-footer"><div><p id="selection" role="status"></p><p id="action-help"></p></div><button class="start-btn" id="confirm">確認藏好，遮住桌面</button></div><button class="btn" id="reset">回到設定</button></section><section class="screen resolution" id="resolution" aria-live="polite"><div class="seal">REVEAL / 揭曉</div><h2 id="resolution-title"></h2><p id="resolution-copy"></p><button class="start-btn" id="continue">繼續</button></section><section class="screen finished" id="finished"><div class="seal">DUEL COMPLETE</div><h2 id="winner"></h2><p id="match-scores"></p><button class="start-btn" id="again">同設定再玩一局</button><button class="btn" id="setup">更換設定</button></section></main><script src="witch-engine.js"></script><script src="witch-ui.js"></script></body></html>
