<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>西瓜合成｜果園小桌</title><link rel="stylesheet" href="suika-orchard.css?v=1"></head><body><main class="app">
<header class="topbar"><a href="/" onclick="saveLobby()">← 遊戲大廳</a><div><small>THE ORCHARD TABLE</small><h1>西瓜合成</h1></div><button id="pause-btn" aria-label="暫停遊戲">Ⅱ</button></header>
<section class="score-row" aria-label="本局紀錄"><div class="sbox"><span>本局分數</span><strong id="score">0</strong></div><div class="sbox"><span>最高紀錄</span><strong id="best">0</strong></div><div class="sbox"><span>最大水果</span><strong id="biggest">櫻桃</strong></div></section>
<div class="next-wrap"><div class="fruit-token" id="current-fruit" aria-hidden="true"></div><div><small>準備投放</small><strong id="current-name">櫻桃</strong></div><span class="queue-arrow">→</span><div class="fruit-token" id="next-fruit" aria-hidden="true"></div><div><small>下一顆</small><strong id="next-name">櫻桃</strong></div><span id="combo-tag" role="status"></span></div>
<div class="game-area" id="game-area"><canvas id="gc" tabindex="0" aria-label="水果合成桌：拖曳選擇位置，放開投放；鍵盤左右移動、空白鍵投放"></canvas><div class="overlay" id="overlay"><div class="ov-card"><small id="ov-label">暫停時光</small><h2 id="ov-title">水果先休息一下</h2><p id="ov-desc"></p><button id="resume-btn">繼續這一局</button><button id="restart-confirm" class="secondary">重新開始</button><a href="/" onclick="saveLobby()">回遊戲大廳</a></div></div><div class="toast" id="toast" role="status"></div></div>
<p class="help" id="help">拖曳選落點，放開投放 · 相同水果碰在一起會長大</p><div class="fruit-ladder" id="fruit-ladder" aria-label="水果合成順序"></div><footer class="btns"><button id="restart-btn">重新開始</button><button id="hint-btn">玩法小筆記</button></footer>
</main><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script><script src="suika-orchard.js?v=1"></script></body></html>
