<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>潮汐之下｜釣魚</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#061018;color:#e8f0ee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;touch-action:manipulation}.app{position:relative;width:100%;max-width:520px;height:100dvh;margin:auto;background:#07141c}.screen{display:none;position:absolute;inset:0}.screen.on{display:block}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.card{position:absolute;left:7%;right:7%;top:50%;transform:translateY(-50%);padding:22px;background:rgba(5,17,23,.92);border:1px solid #49636a;box-shadow:0 14px 60px #0009}.eyebrow{font-size:11px;letter-spacing:.25em;color:#83a9aa}.card h1{margin:8px 0 4px;font-size:29px;letter-spacing:.08em}.card p{font-size:12px;line-height:1.8;color:#9eb2b3}.btn{width:100%;padding:13px;margin-top:10px;border:1px solid #78989a;background:#17313a;color:#eff;font:700 13px inherit}.btn:active{transform:translateY(1px)}.sub{background:transparent;color:#9fb}.hud{position:absolute;top:env(safe-area-inset-top,10px);left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000}.hud b{font-size:15px}.muted{font-size:10px;color:#a7bec0}.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);width:88%;text-align:center;font-size:11px;color:#d3e7e3;text-shadow:0 2px 5px #000}.reel{display:none;position:absolute;left:7%;right:7%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding:10px;background:#071319dc;border:1px solid #516f72}.reel.on{display:block}.meter{height:10px;background:#15262a;position:relative;margin:7px 0}.safe{position:absolute;left:28%;width:44%;top:0;bottom:0;background:#345f55}.needle{position:absolute;width:4px;top:-3px;bottom:-3px;background:#e9e0bd}.reel button{width:100%;padding:12px;background:#b6a46d;border:0;color:#071014;font:800 13px inherit}.catch{position:absolute;left:8%;right:8%;top:18%;padding:14px;background:#06151bea;border:1px solid #78989a;display:none}.catch.on{display:block}.catch h2{margin:2px 0;font-size:21px}.tag{font-size:10px;color:#b8d2cd}.big{font-size:25px;color:#e8d99e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-height:40vh;overflow:auto;margin-top:10px}.tile{border:1px solid #29434a;padding:7px;font-size:9px;color:#9db1b2;min-height:48px}.tile.seen{color:#e7efec;border-color:#567276}.pixel{font-size:9px;opacity:.7}</style></head><body><div class="app"><section id="title" class="screen on"><canvas id="bg"></canvas><div class="card"><div class="eyebrow">LOW PIXEL OCEAN</div><h1>潮汐之下</h1><p>寫實低畫素釣魚。觀察魚影、選擇落點，等待真正的魚訊。咬鉤後控制線張力，把牠帶回水面。</p><button class="btn" id="start">出海</button><button class="btn sub" id="book">魚類圖鑑</button><div class="muted" id="best"></div></div></section><section id="game" class="screen"><canvas id="c"></canvas><div class="hud"><div><b id="weather">薄雲 · 近岸</b><div class="muted" id="casts">剩餘 12 竿</div></div><div style="text-align:right"><b id="money">$ 0</b><div class="muted" id="depth">0 m</div></div></div><div id="hint" class="hint">點擊水下位置拋竿</div><div id="reel" class="reel"><div class="muted">LINE TENSION · 保持在安全區</div><div class="meter"><i class="safe"></i><i id="needle" class="needle"></i></div><button id="reelBtn">收 線</button></div><div id="catch" class="catch"><div class="tag" id="rarity"></div><h2 id="fishName"></h2><div class="big" id="measure"></div><div class="muted" id="record"></div><button class="btn" id="keep">收進魚簍</button></div></section><section id="dex" class="screen"><canvas id="dexbg"></canvas><div class="card" style="top:48%"><div class="eyebrow">FIELD GUIDE</div><h1 style="font-size:22px">魚類圖鑑</h1><div class="grid" id="grid"></div><button class="btn sub" id="back">返回</button></div></section><section id="result" class="screen"><canvas id="resbg"></canvas><div class="card"><div class="eyebrow">RETURN TO PORT</div><h1>返港</h1><p id="summary"></p><button class="btn" id="again">再次出海</button><button class="btn sub" onclick="location.href='/'">回遊戲大廳</button></div></section></div><script>const F=[['sardine','沙丁魚',1,18,.9,0,28],['mackerel','鯖魚',1,24,.8,4,38],['bass','海鱸',2,32,.65,8,48],['squid','魷魚',2,28,.58,15,58],['puffer','河豚',2,30,.5,18,62],['tuna','鮪魚',3,48,.34,25,68],['sword','旗魚',4,58,.18,28,72],['shark','灰鯊',4,64,.16,38,82],['sunfish','翻車魚',5,70,.08,42,78],['manta','鬼蝠魟',5,72,.07,48,84],['oarfish','皇帶魚',6,76,.035,62,96],['angler','深海鮟鱇',6,42,.03,70,99]].map(x=>({id:x[0],name:x[1],rare:x[2],sz:x[3],rate:x[4],d0:x[5],d1:x[6]}));const cv=document.querySelector('#c'),x=cv.getContext('2d'),bg=document.querySelector('#bg'),bx=bg.getContext('2d'),dexbg=document.querySelector('#dexbg'),dx=dexbg.getContext('2d'),resbg=document.querySelector('#resbg'),rx=resbg.getContext('2d');let W,H,sea=120,fish=[],phase='aim',hook={x:0,y:0},target={x:0,y:0},bite=null,tension=45,progress=0,casts=12,cash=0,caught=[],t0=0,raf,hold=false;const seen=JSON.parse(localStorage.getItem('tideDex')||'{}');let best=+localStorage.getItem('tideBest')||0;function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));document.querySelector('#'+id).classList.add('on')}function fit(q){let r=q.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);q.width=r.width*d;q.height=r.height*d;let z=q.getContext('2d');z.setTransform(d,0,0,d,0,0);return[r.width,r.height]}function rand(a,b){return a+Math.random()*(b-a)}function pick(){let pool=F.filter(f=>Math.random()<f.rate),f=pool[Math.floor(Math.random()*pool.length)]||F[0];return f}function spawn(){let f=pick(),d=rand(f.d0,f.d1)/100,y=sea+d*(H-sea),dir=Math.random()<.5?1:-1;return{f,x:dir>0?-50:W+50,y,dir,v:rand(.25,.7)*(1+f.rare*.08),bob:rand(0,6.2)}}function resetFish(){fish=Array.from({length:14},spawn)}function init(){[W,H]=fit(cv);sea=Math.max(105,H*.18);casts=12;cash=0;caught=[];phase='aim';document.querySelector('#reel').classList.remove('on');document.querySelector('#catch').classList.remove('on');resetFish();hud();cancelAnimationFrame(raf);loop()}function hud(){document.querySelector('#casts').textContent='剩餘 '+casts+' 竿';document.querySelector('#money').textContent='$ '+cash;document.querySelector('#depth').textContent=Math.max(0,Math.round((hook.y-sea)/(H-sea)*100))+' m'}function fishShape(c,o){let f=o.f,s=f.sz*.48;c.save();c.translate(o.x,o.y);if(o.dir<0)c.scale(-1,1);c.globalAlpha=.72;c.fillStyle=f.rare>4?'#a7b9ad':'#7f9691';c.beginPath();c.moveTo(-s*.8,0);c.quadraticCurveTo(-s*.25,-s*.28,s*.58,-s*.12);c.lineTo(s,0);c.lineTo(s*.58,s*.14);c.quadraticCurveTo(-s*.25,s*.3,-s*.8,0);c.fill();c.fillStyle='#435a58';c.beginPath();c.moveTo(s*.55,0);c.lineTo(s*1.05,-s*.34);c.lineTo(s*.94,0);c.lineTo(s*1.05,s*.34);c.closePath();c.fill();c.fillStyle='#d5ded5';c.fillRect(-s*.57,-2,2,2);if(f.id==='oarfish'){c.fillStyle='#bac8c0';c.fillRect(-s*1.7,-2,s*2.7,5)}if(f.id==='angler'){c.strokeStyle='#a7d8c2';c.beginPath();c.moveTo(-s*.3,-s*.15);c.quadraticCurveTo(-s*.4,-s*.8,-s*.75,-s*.7);c.stroke();c.fillStyle='#d7fff0';c.fillRect(-s*.78,-s*.74,3,3)}c.restore()}function ocean(c,w,h,time){let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#203943');g.addColorStop(.2,'#17323b');g.addColorStop(.55,'#0b222c');g.addColorStop(1,'#030b11');c.fillStyle=g;c.fillRect(0,0,w,h);c.fillStyle='#6d8585';for(let i=0;i<28;i++){let px=(i*97+time*.006*(i%3+1))%w,py=130+(i*71)%(h-140);c.globalAlpha=.08+(i%4)*.025;c.fillRect(px,py,2,2)}c.globalAlpha=1;c.fillStyle='#0b1a1d';c.fillRect(0,h-18,w,18);for(let i=0;i<9;i++){c.fillStyle=i%2?'#142c2b':'#193431';c.fillRect((i*67)%w,h-18-rand(4,15),3,15)}}function draw(){ocean(x,W,H,performance.now());let sg=x.createLinearGradient(0,sea,0,H);sg.addColorStop(0,'rgba(92,140,145,.12)');sg.addColorStop(1,'rgba(0,0,0,.32)');x.fillStyle=sg;x.fillRect(0,sea,W,H-sea);x.strokeStyle='#6e9897';x.globalAlpha=.35;x.beginPath();for(let px=0;px<=W;px+=5)x.lineTo(px,sea+Math.sin(px*.05+performance.now()/900)*2);x.stroke();x.globalAlpha=1;fish.forEach(o=>fishShape(x,o));x.fillStyle='#162126';x.fillRect(W*.44,sea-27,70,18);x.fillStyle='#725e45';x.fillRect(W*.45,sea-31,58,5);x.strokeStyle='#b8aa7a';x.lineWidth=2;x.beginPath();x.moveTo(W*.55,sea-24);x.lineTo(W*.7,sea-67);x.stroke();if(phase!=='aim'){x.strokeStyle='#d6d0ae';x.lineWidth=1;x.beginPath();x.moveTo(W*.7,sea-67);x.lineTo(hook.x,hook.y);x.stroke();x.fillStyle='#c9b886';x.fillRect(hook.x-1,hook.y,3,5)}if(phase==='bite'||phase==='fight'){x.fillStyle='#e9ddaa';x.font='bold 13px monospace';x.fillText(phase==='bite'?'魚訊！點擊收線':'保持張力',12,sea+25)}}function update(){let now=performance.now();fish.forEach(o=>{o.x+=o.v*o.dir;o.y+=Math.sin(now/900+o.bob)*.08;if(o.x>W+70||o.x<-70)Object.assign(o,spawn())});if(phase==='sink'){let p=Math.min(1,(now-t0)/650);hook.x+=(target.x-hook.x)*.12;hook.y+=(target.y-hook.y)*.12;if(p>=1){phase='wait';t0=now+rand(650,1900)}}else if(phase==='wait'&&now>t0){let near=fish.filter(o=>Math.hypot(o.x-hook.x,o.y-hook.y)<95).sort((a,b)=>Math.hypot(a.x-hook.x,a.y-hook.y)-Math.hypot(b.x-hook.x,b.y-hook.y));if(near[0]&&Math.random()<.72){bite=near[0];phase='bite';t0=now+900;document.querySelector('#hint').textContent='魚訊！立刻點擊畫面或按收線'}else{t0=now+600}}else if(phase==='bite'&&now>t0){miss('太慢，脫鉤了')}else if(phase==='fight'){let power=(bite.f.rare*.22+.55);tension+=Math.sin(now/190+bite.bob)*power+(Math.random()-.48)*1.2;tension+=hold?1.25:-.62;progress+=hold&&tension>25&&tension<78?.55:.08;tension=Math.max(0,Math.min(100,tension));document.querySelector('#needle').style.left=tension+'%';if(tension>=96)miss('魚線繃斷了');else if(tension<=3)miss('魚掙脫了');else if(progress>=100)land()}}function loop(){update();draw();hud();raf=requestAnimationFrame(loop)}function castAt(px,py){if(phase!=='aim'||casts<=0)return;casts--;target={x:px,y:Math.max(sea+18,py)};hook={x:W*.7,y:sea-67};phase='sink';t0=performance.now();document.querySelector('#hint').textContent='等待魚訊…';hud()}function strike(){if(phase==='bite'){phase='fight';progress=0;tension=45;document.querySelector('#reel').classList.add('on');document.querySelector('#hint').textContent='按住「收線」增加張力，放開讓線'}}function miss(msg){phase='aim';bite=null;document.querySelector('#reel').classList.remove('on');document.querySelector('#hint').textContent=casts?'點擊水下位置再次拋竿':msg;if(!casts)setTimeout(done,700)}function land(){let f=bite.f,kg=Math.max(.08,(f.sz*f.sz/700)*rand(.65,1.35)),cm=Math.round(f.sz*rand(1.7,2.7)),value=Math.round(f.rare*18+kg*9);cash+=value;caught.push(f);let old=seen[f.id]?.kg||0,isRec=kg>old;seen[f.id]={kg:Math.max(kg,old),cm:Math.max(cm,seen[f.id]?.cm||0)};localStorage.setItem('tideDex',JSON.stringify(seen));document.querySelector('#rarity').textContent='★'.repeat(f.rare)+' · '+(isRec?'NEW RECORD':'CATCH');document.querySelector('#fishName').textContent=f.name;document.querySelector('#measure').textContent=kg.toFixed(2)+' kg · '+cm+' cm';document.querySelector('#record').textContent='估值 $'+value+(isRec?'　／　個人新紀錄':'');document.querySelector('#catch').classList.add('on');document.querySelector('#reel').classList.remove('on');phase='caught'}function done(){cancelAnimationFrame(raf);if(cash>best){best=cash;localStorage.setItem('tideBest',best)}show('result');fit(resbg);paintStill(rx,resbg);document.querySelector('#summary').innerHTML='本次帶回 <b>'+caught.length+'</b> 尾魚，漁獲價值 <b>$'+cash+'</b>。<br>最高單次紀錄：$'+best}function paintStill(c,q){let [w,h]=fit(q);ocean(c,w,h,0);c.fillStyle='rgba(2,8,12,.35)';c.fillRect(0,0,w,h)}function dex(){show('dex');paintStill(dx,dexbg);let g=document.querySelector('#grid');g.innerHTML='';F.forEach(f=>{let s=seen[f.id],e=document.createElement('div');e.className='tile '+(s?'seen':'');e.innerHTML=s?'<b>'+f.name+'</b><br>'+'★'.repeat(f.rare)+'<br>'+s.kg.toFixed(2)+'kg':'???<br><span class="pixel">未發現</span>';g.appendChild(e)})}cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect(),px=(e.clientX-r.left),py=(e.clientY-r.top);if(phase==='aim'&&py>sea)castAt(px,py);else strike()});let rb=document.querySelector('#reelBtn');rb.addEventListener('pointerdown',e=>{e.preventDefault();hold=true;strike()});['pointerup','pointercancel','pointerleave'].forEach(n=>rb.addEventListener(n,()=>hold=false));document.querySelector('#keep').onclick=()=>{document.querySelector('#catch').classList.remove('on');bite=null;phase='aim';document.querySelector('#hint').textContent=casts?'點擊水下位置再次拋竿':'本次航程結束…';if(!casts)setTimeout(done,500)};document.querySelector('#start').onclick=()=>{show('game');init()};document.querySelector('#again').onclick=()=>{show('game');init()};document.querySelector('#book').onclick=dex;document.querySelector('#back').onclick=()=>show('title');document.querySelector('#best').textContent=best?'最高航次 $'+best:'';paintStill(bx,bg);addEventListener('resize',()=>{if(document.querySelector('#game').classList.contains('on'))init()});</script></body></html>
