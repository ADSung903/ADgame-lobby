function home(){stopVoice();G=null;app.innerHTML=`<section class="hero"><div><span class="eyebrow">看一看 · 問一問 · 想一想</span><h1>咦，藏起來的<br><em>朋友是誰？</em></h1><p class="muted">一張圖卡，一個小線索。<br>和小狐狸一起，發現答案！</p><span class="pill">48 位朋友，3 種玩法</span></div><div class="scene" aria-hidden="true"><span class="scene-card">🐰</span><span class="scene-card">🍓</span><span class="scene-card">🔎</span></div></section><div class="section-label">今天，想怎麼玩？</div><div class="modes">${Object.entries(MODES).map(([id,m])=>`<button class="mode" data-mode="${id}" aria-pressed="${mode===id}"><span class="mode-icon">${m[0]}</span><strong>${m[1]}</strong><small>${m[2]}</small></button>`).join('')}</div><div class="settings"><div class="field"><label for="theme">去哪裡找朋友？</label><select id="theme"><option value="animal">🐾 動物森林</option><option value="food">🍓 美味野餐</option><option value="vehicle">🚗 出發旅行</option><option value="thing">🏠 生活小屋</option><option value="all">🌈 全部混合</option></select></div><div class="field"><label for="size">這次找幾張？</label><select id="size"><option value="6">🌱 6 張 · 初次探險</option><option value="9">🌿 9 張 · 多看一看</option><option value="12">🌳 12 張 · 小小挑戰</option></select></div><button class="primary start" id="start">一起出發 →</button></div><div class="collection"><b>我的發現冊</b><p class="muted">認識了 ${progress.found.length} / 48 位朋友 · 完成 ${progress.rounds} 次探索</p><div class="collection-grid">${progress.found.length?progress.found.map(id=>{const x=ITEMS.find(i=>i.id===id);return `<span class="stamp" title="${x.name}" aria-label="${x.name}">${x.art}</span>`;}).join(''):'<span class="muted">找到的朋友會在這裡留下小印章。</span>'}</div></div>`;$('theme').value=theme;$('size').value=String(size);app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;app.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.mode===mode));});$('theme').onchange=e=>theme=e.target.value;$('size').onchange=e=>size=+e.target.value;$('start').onclick=start;headingFocus();}
function splitQuestions(cards,used=[]){return Object.keys(TRAITS).filter(k=>!used.includes(k)&&!['red','yellow','green'].includes(k)).map(k=>({k,n:cards.filter(x=>x.tags.has(k)).length})).filter(q=>q.n>0&&q.n<cards.length);}
function rankedQuestions(cards,used=[]){return shuffle(splitQuestions(cards,used)).sort((a,b)=>Math.abs(a.n-cards.length/2)-Math.abs(b.n-cards.length/2)).map(q=>q.k);}
function candidates(){return G.cards.filter(x=>G.alive.includes(x.id));}
function start(){stopVoice();let pool=ITEMS.filter(x=>theme==='all'||x.group===theme);const cards=shuffle(pool).slice(0,size);let target=shuffle(cards.filter(x=>x.id!==lastTarget))[0]||cards[0];lastTarget=target.id;G={cards,alive:cards.map(x=>x.id),target,used:[],history:[],clues:[],count:0,feedback:'',selected:[],phase:mode==='robot'?'choose':'play',query:null,questionOptions:[]};if(mode==='match'){const first=rankedQuestions(cards)[0];G.rules=[{key:first,yes:true}];if(size>=9){const subset=cards.filter(x=>x.tags.has(first));const second=rankedQuestions(subset,[first])[0];if(second)G.rules.push({key:second,yes:Math.random()>.5});}G.matches=cards.filter(x=>G.rules.every(r=>x.tags.has(r.key)===r.yes)).map(x=>x.id);}refresh();render();headingFocus();say(instruction());}
function refresh(){if(mode==='detective')G.questionOptions=G.count>=20?[]:rankedQuestions(candidates(),G.used).slice(0,3);if(mode==='robot'&&G.phase==='play')G.query=rankedQuestions(candidates(),G.used)[0]||null;}
function instruction(){if(mode==='robot'){if(G.phase==='choose')return '在心裡選好一張圖卡，不要告訴電腦。想好了，再按開始提問。';if(G.phase==='guess')return '電腦提出了猜測。看看它猜對了嗎？';return G.query?TRAITS[G.query][1]:'現在的線索還分不出來，你想的是哪一張？';}if(mode==='match')return '找出所有'+G.rules.map(r=>(r.yes?'':'不')+TRAITS[r.key][2]).join('，而且')+'的朋友。';return '我藏好了一位朋友。選問題找線索，或點圖卡猜猜看！';}
function snapshot(){return {alive:[...G.alive],used:[...G.used],clues:[...G.clues],count:G.count,phase:G.phase,query:G.query,feedback:G.feedback};}
function undo(){if(!G.history.length)return;Object.assign(G,G.history.pop());G.phase='play';G.feedback='回到上一步了，可以重新想一想。';refresh();render();say(G.feedback);}
function applyAnswer(key,answer){if(!G||G.phase!=='play')return;const next=answer===null?G.alive:G.cards.filter(x=>G.alive.includes(x.id)&&x.tags.has(key)===answer).map(x=>x.id);if(!next.length){G.feedback='這個答案和前面的線索不太一樣。可以按「上一步」重新想想。';render();say(G.feedback);return;}G.history.push(snapshot());const before=G.alive.length;G.alive=next;G.used.push(key);G.count++;G.clues.push({key,answer});G.feedback=answer===null?'沒關係，換一個問題！':`${answer?'✓ 是的':'✕ 不是'}！排除了 ${before-next.length} 張，還有 ${next.length} 位朋友。`;if(mode==='robot'&&(next.length===1||G.count>=20))G.phase=next.length===1?'guess':'shortlist';refresh();render();say(G.feedback+(mode==='robot'&&G.phase==='play'?' '+instruction():''));}
function ask(key){if(mode==='detective'&&G.questionOptions.includes(key))applyAnswer(key,G.target.tags.has(key));}
function cardClick(id){if(!G||!['play','shortlist'].includes(G.phase))return;const x=G.cards.find(i=>i.id===id);if(mode==='match'){G.selected=G.selected.includes(id)?G.selected.filter(i=>i!==id):[...G.selected,id];G.feedback='';render();return;}if(mode==='robot'){finish(x,false,'謝謝你告訴我！有些朋友很像，我們再一起認識牠。');return;}if(!G.alive.includes(id))return;if(id===G.target.id)finish(x,true,'你找到神祕朋友了！');else{G.feedback=`${x.name}不是這次藏起來的朋友，再問一個問題看看。`;render();say(G.feedback);}}
function checkMatch(){const ok=G.matches.length===G.selected.length&&G.matches.every(id=>G.selected.includes(id));if(ok)finish(G.cards.find(x=>G.matches.includes(x.id)),true,'全部找到了！你發現了朋友們的共同點。',G.matches);else{G.feedback='還差一點點。再看看每張圖卡，要同時符合上面的線索喔！';render();say(G.feedback);}}
function render(){const choosing=G.phase==='choose',guessing=G.phase==='guess';const shortlist=G.phase==='shortlist'||(mode==='robot'&&G.phase==='play'&&!G.query);if(shortlist)G.phase='shortlist';let message=instruction();if(guessing){const x=candidates()[0];message=`我猜是 ${x.art} ${x.name}！`;}app.innerHTML=`<section><div class="gamebar"><h1>${MODES[mode][0]} ${MODES[mode][1]}</h1><span class="pill">${mode==='match'?'觀察小任務':choosing?'準備好了嗎？':`已問 ${G.count} 題`}</span></div><div class="panel" style="margin-top:0"><div class="prompt"><span class="mascot" aria-hidden="true">🦊</span><div><h2>${message}</h2><p>${mode==='detective'?'點下面的問題找線索，再點圖卡猜答案。':mode==='match'?'點一下選取，再點一下取消。選好後按「找好了」。':choosing?'只要記在心裡，不用點圖卡。電腦只會根據你的回答猜。':guessing?'猜錯也沒關係，我們可以重新整理線索。':shortlist?'剩下的圖卡都符合你的回答，請點選你想的那張。':'不確定就選「不知道」。答錯可以回上一步。'}</p></div></div>${mode==='detective'&&G.phase==='play'?`<div class="question-options">${G.questionOptions.map(k=>`<button class="question" data-question="${k}"><span aria-hidden="true">${TRAITS[k][0]}</span>${TRAITS[k][1]}</button>`).join('')}</div>${!G.questionOptions.length?'<p class="muted">線索已經收集好了，點一張圖卡猜猜看。</p>':''}`:''}${mode==='robot'&&choosing?'<div class="response"><button class="primary" id="ready">想好了，開始提問 →</button></div>':mode==='robot'&&guessing?'<div class="response"><button class="yes" id="correct">✓ 猜對了</button><button class="no" id="incorrect">再想一想</button></div>':mode==='robot'&&!shortlist?'<div class="response"><button class="yes" id="yes">✓ 是的</button><button class="no" id="no">✕ 不是</button><button id="unknown">🤔 不知道</button></div>':''}<div class="feedback" role="status">${G.feedback}</div><div class="tools"><button id="read">🔊 再聽一次</button>${mode!=='match'&&!choosing?`<button id="undo" ${G.history.length?'':'disabled'}>↶ 上一步</button>`:''}<button id="restart">換一組朋友</button></div></div><div class="board-title"><strong>${mode==='match'?`已選 ${G.selected.length} 位朋友`:choosing?'偷偷選好一張，記在心裡':`還有 ${G.alive.length} / ${G.cards.length} 位朋友`}</strong><span class="muted">${mode==='match'?'看清楚，再選喔':mode==='robot'&&!shortlist?'先回答上面的問題':'點圖卡猜答案'}</span></div><div class="board">${G.cards.map(x=>{const out=!G.alive.includes(x.id);const selected=G.selected.includes(x.id);const disabled=out||choosing||guessing||(mode==='robot'&&!shortlist);return `<button class="tile ${out?'out':''} ${selected?'picked':''}" data-card="${x.id}" ${disabled?'disabled':''} ${mode==='match'?`aria-pressed="${selected}"`:''} aria-label="${x.name}${out?'，已排除':''}"><span class="art" aria-hidden="true">${x.art}</span><span class="name">${x.name}</span></button>`;}).join('')}</div>${mode==='match'?'<div class="response"><button class="primary" id="check">找好了 ✓</button></div>':`<div class="log" aria-label="已收集的線索">${G.clues.map(c=>`<span class="clue">${c.answer===null?'?':c.answer?'✓':'✕'} ${TRAITS[c.key][2]}${c.answer===null?'（不知道）':''}</span>`).join('')}</div>`}</section>`;
app.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>ask(b.dataset.question));app.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>cardClick(b.dataset.card));$('read').onclick=()=>{if(!('speechSynthesis'in window)){G.feedback='這個瀏覽器沒有語音朗讀，可以請大人一起讀線索。';render();return;}say(instruction(),true);};$('restart').onclick=start;if($('undo'))$('undo').onclick=undo;if($('ready'))$('ready').onclick=()=>{G.phase='play';refresh();render();say(instruction());};if($('yes')){$('yes').onclick=()=>applyAnswer(G.query,true);$('no').onclick=()=>applyAnswer(G.query,false);$('unknown').onclick=()=>applyAnswer(G.query,null);}if($('correct')){$('correct').onclick=()=>finish(candidates()[0],true,'一起找到答案了！');$('incorrect').onclick=()=>{G.feedback='可以按「上一步」改回答，或換一組朋友重新玩。';render();say(G.feedback);};}if($('check'))$('check').onclick=checkMatch;}
function finish(x,success,message,ids=[x.id]){if(!G||G.phase==='done')return;G.phase='done';stopVoice();let saved=true;if(success){progress.rounds++;progress.found=[...new Set([...progress.found,...ids])];try{localStorage.setItem(STORE,JSON.stringify(progress));}catch{saved=false;}}app.innerHTML=`<section class="finish"><span class="eyebrow">${success?'又多了一個新發現':'每次探索，都會學到新東西'}</span><span class="big" aria-hidden="true">${x.art}</span><h1>${message}</h1><p>${mode==='match'?ids.map(id=>ITEMS.find(i=>i.id===id).name).join('、'):x.name}</p><div class="fact">💡 ${x.fact}</div><p class="muted">${success?`發現冊：${progress.found.length} / 48 位朋友`:'下次也可以試試「我來猜」，一起看圖找線索。'}${!saved?' · 目前無法儲存，關閉頁面後這次紀錄可能消失。':''}</p><div class="progress"><div style="width:${progress.found.length/48*100}%"></div></div><div class="response"><button class="primary" id="again">再探險一次 →</button><button id="backhome">換個玩法</button></div></section>`;$('again').onclick=start;$('backhome').onclick=home;headingFocus();say(message+' '+x.name+'。'+x.fact);}
$('sound').onclick=()=>{if(!('speechSynthesis'in window)){say('這個瀏覽器沒有語音朗讀功能。');$('sound').textContent='無語音支援';return;}sound=!sound;$('sound').setAttribute('aria-pressed',sound);$('sound').setAttribute('aria-label',sound?'關閉自動朗讀':'開啟自動朗讀');$('sound').textContent=sound?'🔊 朗讀':'🔇 朗讀';if(sound)say(G?instruction():'你好！一起來當小偵探。');else stopVoice();};$('home').onclick=home;$('lobby').onclick=()=>{stopVoice();location.href='../';};window.addEventListener('pagehide',stopVoice);home();
</script></body></html>
