<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>深海釣魚 V2</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02162c;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:white}.g{position:relative;margin:auto;width:min(100vw,480px);height:100dvh;overflow:hidden;background:#043d70 url('./assets/scene/scene_far.svg') center/cover no-repeat}.surface{position:absolute;top:17%;width:100%;height:5%;background:linear-gradient(180deg,#b8f7ff,#13a8d4 35%,transparent);clip-path:polygon(0 35%,8% 10%,17% 38%,27% 12%,38% 39%,48% 8%,60% 37%,70% 14%,82% 40%,92% 10%,100% 34%,100% 100%,0 100%)}.sun{position:absolute;top:18%;left:16%;width:68%;height:62%;background:linear-gradient(105deg,transparent 12%,rgba(184,249,255,.22) 22%,transparent 33%,rgba(170,243,255,.13) 45%,transparent 57%);pointer-events:none}.reef{position:absolute;bottom:-2%;left:-8%;right:-8%;height:28%;background:radial-gradient(ellipse at 12% 70%,#e35f4f 0 4%,transparent 5%),radial-gradient(ellipse at 83% 75%,#8b59d4 0 5%,transparent 6%),radial-gradient(ellipse at 28% 82%,#e6a934 0 5%,transparent 6%),linear-gradient(165deg,transparent 25%,#073c49 26% 50%,#031d31 51%);filter:drop-shadow(0 -10px 20px #00334c)}.boat{position:absolute;top:11%;left:51%;transform:translateX(-50%);font-size:64px;filter:drop-shadow(0 5px 4px #064);animation:b 3s ease-in-out infinite}@keyframes b{50%{transform:translate(-50%,4px) rotate(1deg)}}.hud{position:absolute;z-index:20;top:max(9px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:6px}.p{border:1px solid #8deaff88;background:#002d52c9;border-radius:18px;padding:8px 11px;color:white;font-size:13px;backdrop-filter:blur(8px)}button.p{font-weight:700}.fish{position:absolute;z-index:7;font-size:var(--s);transform-origin:center;filter:drop-shadow(0 4px 5px #001b);transition:filter .2s,opacity .35s}.fish[data-state=hooked]{filter:brightness(1.5) drop-shadow(0 0 12px #fff)}.fish[data-state=reeling]{transition:left .55s ease-in,top .55s ease-in,transform .55s ease-in}.fish[data-state=caught]{opacity:0;transform:scale(.35)!important}.line{position:absolute;z-index:12;height:2px;background:#fff4c8;transform-origin:0 50%;box-shadow:0 0 4px white;display:none}.hook{position:absolute;z-index:13;font-size:18px;display:none;transform:translate(-50%,-50%)}.depth{position:absolute;left:7px;color:#d3f6ff99;font-size:11px;z-index:4}.toast{position:absolute;z-index:30;left:50%;top:42%;transform:translate(-50%,-50%);font-size:20px;font-weight:800;color:#fff0a2;text-shadow:0 3px 8px #001;opacity:0}.toast.on{animation:t .9s}@keyframes t{20%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px)}}.hint{position:absolute;z-index:20;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap;background:#001d39aa;padding:8px 13px;border-radius:18px;font-size:12px;color:#c5f2ff}.wreck{position:absolute;z-index:3;top:68%;left:48%;font-size:75px;opacity:.25;transform:rotate(-13deg)}.jelly{position:absolute;z-index:3;font-size:28px;opacity:.6;animation:j 5s ease-in-out infinite alternate}@keyframes j{to{transform:translateY(-18px)}}</style></head><body><main class="g" id="g"><div class="surface"></div><div class="sun"></div><div class="reef"></div><div class="wreck">⛵</div><div class="jelly" style="top:72%;left:74%">🪼</div><div class="jelly" style="top:78%;left:66%;animation-delay:-2s">🪼</div><div class="boat">🚤</div><div class="hud"><button class="p" onclick="location.href='/'">‹ 大廳</button><div class="p">☀️ 晴朗　下竿 <b id="n">0</b>/20　🏆 <b id="score">0</b></div><button class="p" id="cast">🎣 下竿</button></div><span class="depth" style="top:29%">淺層 0–50m</span><span class="depth" style="top:48%">中層 50–200m</span><span class="depth" style="top:67%">深層 200–500m</span><span class="depth" style="top:84%">深淵 500m+</span><div class="line" id="line"></div><div class="hook" id="hook">🪝</div><div class="toast" id="toast"></div><div class="hint" id="hint">點擊水下位置下竿 · V2 gameplay build</div></main><script type="module">import {FISH_SPECIES} from './data/species.js';import {FishingSession,FishState} from './engine/game.js';const g=document.querySelector('#g'),S=new FishingSession(20),nodes=new Map();const glyph={sardine:'🐟',carp:'🐠',clownfish:'🐠',mackerel:'🐟',flyingfish:'🐟',dolphin:'🐬',seal:'🦭',bass:'🐟',squid:'🦑',shrimp:'🦐',jellyfish:'🪼',seahorse:'🐴',lionfish:'🐠',shark:'🦈',turtle:'🐢',blowfish:'🐡',swordfish:'🐟',octopus:'🐙',crab:'🦀',lobster:'🦞',sunfish:'🐟',whale:'🐋',manta:'🐟',oarfish:'🐟',angler:'🐟',viperfish:'🐟'};let uid=0,busy=false;function band(d){return d==='shallow'?[24,43]:d==='mid'?[40,61]:d==='deep'?[58,79]:[76,91]}function spawn(spec){const [a,b]=band(spec.depth),e={uid:'f'+(++uid),speciesId:spec.id,x:8+Math.random()*84,y:a+Math.random()*(b-a),dir:Math.random()<.5?-1:1,speed:.008+Math.random()*.018};S.addFish(e);const el=document.createElement('div');el.className='fish';el.textContent=glyph[spec.id]||'🐟';el.style.setProperty('--s',(spec.rarity>=4?48:spec.rarity>=3?40:30)+'px');g.append(el);nodes.set(e.uid,el);return e}let entities=FISH_SPECIES.map(spawn);function frame(){entities.forEach(e=>{if(e.state!==FishState.SWIMMING)return;e.x+=e.speed*e.dir;if(e.x>104){e.x=-4;e.dir=1}if(e.x<-4){e.x=104;e.dir=-1}const el=nodes.get(e.uid);if(el){el.style.left=e.x+'%';el.style.top=e.y+'%';el.style.transform='translate(-50%,-50%) scaleX('+(e.dir<0?-1:1)+')';el.dataset.state=e.state}});requestAnimationFrame(frame)}requestAnimationFrame(frame);const line=document.querySelector('#line'),hook=document.querySelector('#hook'),toast=document.querySelector('#toast');function cast(x,y){if(busy||!S.useCast())return;busy=true;n.textContent=S.casts;const r=g.getBoundingClientRect(),sx=r.width*.53,sy=r.height*.16,dx=x-sx,dy=y-sy;line.style.display=hook.style.display='block';line.style.left=sx+'px';line.style.top=sy+'px';line.style.width=Math.hypot(dx,dy)+'px';line.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';hook.style.left=x+'px';hook.style.top=y+'px';let best=null,bd=1e9;entities.forEach(e=>{if(e.state!==FishState.SWIMMING)return;const el=nodes.get(e.uid),q=el.getBoundingClientRect(),fx=q.left+q.width/2-r.left,fy=q.top+q.height/2-r.top,d=Math.hypot(x-fx,y-fy);if(d<38&&d<bd){best=e;bd=d}});setTimeout(()=>{if(!best){msg('空鉤…');return finish()}S.hook(best.uid);nodes.get(best.uid).dataset.state=best.state;setTimeout(()=>{S.reel(best.uid);const el=nodes.get(best.uid);el.dataset.state=best.state;el.style.left='53%';el.style.top='16%';setTimeout(()=>{const got=S.catch(best.uid);el.dataset.state=best.state;msg('釣到 '+got.species.name+' +'+got.species.points);score.textContent=S.score;setTimeout(()=>{S.despawn(best.uid);el.remove();nodes.delete(best.uid);entities=entities.filter(x=>x.uid!==best.uid);entities.push(spawn(got.species));finish()},360)},560)},260)},420)}function finish(){setTimeout(()=>{line.style.display=hook.style.display='none';busy=false;if(!S.canCast())hint.textContent='本局結束 · '+S.score+' 分'},300)}function msg(s){toast.textContent=s;toast.classList.remove('on');void toast.offsetWidth;toast.classList.add('on')}g.addEventListener('pointerdown',e=>{if(e.target.closest('.hud'))return;const r=g.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(y>r.height*.2)cast(x,y)});cast.onclick=()=>{const r=g.getBoundingClientRect();cast(r.width*(.2+Math.random()*.6),r.height*(.3+Math.random()*.55))}</script></body></html>
