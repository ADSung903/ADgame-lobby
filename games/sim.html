<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>企業模擬經營 v1.52</title>
<style>
:root{
  --bg:#0f1923;--surface:#172030;--surface2:#1e293b;--line:#2a3a4a;
  --gold:#d3a44c;--gold-dim:#7a5e2a;--text:#e2eaf0;--muted:#8fa1ad;
  --green:#4caf6d;--yellow:#d3a44c;--orange:#dd7f3a;--red:#cf4a44;
  --blue:#4a90d9;--purple:#9b6fce;--teal:#3ab8a0;--pink:#c97a9b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Noto Sans TC",system-ui,sans-serif;font-size:13px;overflow:hidden;}
.screen{display:none;flex-direction:column;height:100vh;}
.screen.active{display:flex;}

/* SETUP */
#screen-setup{align-items:center;justify-content:center;padding:40px 20px;overflow-y:auto;}
#screen-setup h1{font-size:28px;color:var(--gold);letter-spacing:2px;margin-bottom:6px;font-family:"Noto Serif TC",Georgia,serif;}
.tagline{color:var(--muted);font-size:12px;margin-bottom:32px;}
.ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:820px;}
.ind-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s;}
.ind-card:hover:not(.disabled){border-color:var(--gold);}
.ind-card.disabled{opacity:.4;cursor:not-allowed;}
.ind-name{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:4px;}
.ind-cap{font-size:11px;color:var(--muted);margin-bottom:8px;}
.ind-desc{font-size:11px;color:var(--muted);line-height:1.5;}
.badge-soon{display:inline-block;background:var(--line);color:var(--muted);font-size:10px;padding:2px 8px;border-radius:20px;margin-top:6px;}

/* TOPBAR */
#topbar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;gap:10px;min-height:48px;}
.co-name{font-size:15px;font-weight:700;color:var(--gold);}
.co-month{font-size:11px;color:var(--muted);}
.topbar-r{display:flex;align-items:center;gap:7px;}
.tbtn{background:var(--surface2);border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:11px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
.tbtn:hover{border-color:var(--gold);}
.tbtn.primary{background:var(--gold);color:#1a1305;border:none;font-weight:700;}
.tbtn.primary:hover{background:#e3b75c;}

/* GAME BODY */
#game-body{flex:1;display:flex;overflow:hidden;}

/* OFFICE AREA */
#office-area{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px;gap:8px;}
#boss-row{flex-shrink:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--gold-dim);border-radius:10px;padding:8px 14px;}
.boss-info .name{font-size:13px;font-weight:700;color:var(--gold);}
.boss-info .sub{font-size:10px;color:var(--muted);}
#gm-node{display:flex;align-items:center;gap:8px;background:rgba(211,164,76,.07);border:1px solid var(--gold-dim);border-radius:8px;padding:5px 10px;margin-left:8px;}
#gm-node .gm-label{font-size:11px;color:var(--gold);}
#gm-node .gm-sub{font-size:10px;color:var(--muted);}

#rooms-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;min-height:0;}
.room{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;overflow:hidden;}
.room-hdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.room-name{font-size:11px;font-weight:700;}
.d-badge{font-size:9px;padding:2px 6px;border-radius:20px;background:rgba(74,144,217,.12);color:var(--blue);border:1px solid rgba(74,144,217,.25);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;}
.kpi-row{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.kpi-lbl{font-size:9px;color:var(--muted);min-width:44px;}
.kpi-track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
.kpi-fill{height:100%;border-radius:2px;transition:width .4s;}
.kpi-v{font-size:9px;color:var(--muted);min-width:22px;text-align:right;}
.room-floor{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;flex:1;align-content:flex-end;}
.emp-fig{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;}
.emp-fig svg,.emp-fig .fig{display:block;}
.fig{position:relative;display:inline-block;flex-shrink:0;}
.fig img{width:100%;height:100%;object-fit:contain;object-position:bottom;image-rendering:pixelated;display:block;-webkit-user-drag:none;}
.fig .mood{position:absolute;top:-1px;right:-2px;width:6px;height:6px;border-radius:50%;border:1px solid rgba(0,0,0,.35);}
.fig .rband{position:absolute;bottom:-3px;left:15%;width:70%;height:2px;border-radius:2px;opacity:.9;}
.emp-fig .emp-name{font-size:8px;color:var(--muted);max-width:34px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center;}
.emp-fig .rumor-bub{position:absolute;top:-9px;right:-4px;font-size:9px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:0 3px;line-height:12px;z-index:5;animation:emp-idle 2.5s ease-in-out infinite;}
.emp-fig .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;white-space:nowrap;font-size:10px;color:var(--text);z-index:20;}
.emp-fig:hover .tip{display:block;}
.plus-slot{width:30px;height:40px;background:var(--surface2);border:1px dashed var(--gold-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);font-size:16px;flex-shrink:0;}
.plus-slot:hover{background:rgba(211,164,76,.08);}
.locked-room{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:1;}
.locked-room .lroom-name{font-size:12px;font-weight:700;color:var(--muted);}
.locked-room .lroom-hint{font-size:10px;color:var(--muted);text-align:center;line-height:1.4;}
.unlock-btn{font-size:10px;padding:4px 10px;background:var(--surface2);border:1px solid var(--gold-dim);color:var(--gold);border-radius:6px;cursor:pointer;}
.unlock-btn:hover:not(:disabled){background:rgba(211,164,76,.1);}
.unlock-btn:disabled{opacity:.4;cursor:not-allowed;}
.invest-row{display:flex;gap:4px;flex-shrink:0;}
.invest-btn,.expand-btn{font-size:9px;padding:3px 6px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:5px;cursor:pointer;}
.invest-btn:hover:not(:disabled),.expand-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.invest-btn:disabled,.expand-btn:disabled{opacity:.4;cursor:not-allowed;}

/* room name colors */
.room[data-dept=sales] .room-name{color:var(--blue);}
.room[data-dept=rd] .room-name{color:var(--purple);}
.room[data-dept=prod] .room-name{color:var(--orange);}
.room[data-dept=qa] .room-name{color:var(--teal);}
.room[data-dept=proc] .room-name{color:#7a8fa3;}
.room[data-dept=fin] .room-name{color:var(--teal);}
.room[data-dept=global] .room-name{color:var(--pink);}

/* SIDE PANEL */
#side-panel{width:264px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface);transition:width .2s;overflow:hidden;}
#side-panel.collapsed{width:0;}
#side-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;}
.s-tab{flex:1;padding:7px 4px;font-size:10px;color:var(--muted);text-align:center;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.s-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
#side-content{flex:1;overflow-y:auto;padding:10px;}
.s-stat{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px dashed var(--line);}
.s-stat:last-child{border-bottom:none;}
.s-lbl{color:var(--muted);}
.s-val{font-family:ui-monospace,monospace;}
.pos{color:var(--green);}.neg{color:var(--red);}
.true-val{color:var(--teal);}.rpt-val{color:var(--yellow);}
.risk-wrap{margin-bottom:8px;}
.risk-hdr{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px;}
.risk-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
.risk-fill{height:100%;border-radius:2px;transition:width .3s;}
.log-item{padding:5px 0;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.4;}
.log-m{color:var(--gold);font-family:monospace;margin-right:4px;}
.pj-card{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;}
.pj-nm{font-size:11px;font-weight:700;margin-bottom:4px;}
.pj-stages{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:4px;}
.pj-pill{font-size:8px;padding:2px 4px;border-radius:10px;background:var(--line);color:var(--muted);}
.pj-pill.active{background:var(--gold);color:#1a1305;font-weight:700;}
.pj-pill.done{background:var(--green);color:#0a1a10;}
.pj-info{font-size:10px;color:var(--muted);}
.pj-info.ok{color:var(--teal);}.pj-info.warn{color:var(--orange);}

/* BOTTOM BAR */
#bottom-bar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);padding:7px 14px;display:flex;gap:14px;align-items:flex-start;overflow-x:auto;}
.bar-sec{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.bar-sec-lbl{font-size:9px;color:var(--gold);letter-spacing:.5px;}
.bactions{display:flex;gap:5px;flex-wrap:nowrap;}
.abtn{font-size:10px;padding:5px 9px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;}
.abtn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.abtn:disabled{opacity:.35;cursor:not-allowed;}
.used-tag{font-size:8px;background:var(--line);color:var(--muted);border-radius:3px;padding:1px 4px;}
.div-v{width:1px;background:var(--line);align-self:stretch;flex-shrink:0;}
.dirs-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.dir-item{display:flex;align-items:center;gap:4px;}
.dir-nm{font-size:9px;color:var(--muted);min-width:30px;}
.dir-sel{background:var(--surface2);border:1px solid var(--line);border-radius:5px;color:var(--text);font-size:9px;padding:3px 4px;max-width:86px;}
#bar-proj{display:flex;align-items:center;gap:6px;}
#new-proj-btn{font-size:10px;padding:5px 9px;background:var(--surface2);border:1px dashed var(--gold-dim);border-radius:6px;color:var(--gold);cursor:pointer;white-space:nowrap;}
#new-proj-btn:hover:not(:disabled){background:rgba(211,164,76,.08);}
#new-proj-btn:disabled{opacity:.35;cursor:not-allowed;}
#proj-cap{font-size:9px;color:var(--muted);}
#side-toggle{font-size:10px;padding:5px 9px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;}
#side-toggle:hover{color:var(--text);}

/* MODALS */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,14,22,.82);align-items:center;justify-content:center;z-index:50;}
#modal-overlay.open{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--gold-dim);border-radius:14px;width:min(560px,92vw);max-height:88vh;overflow-y:auto;padding:22px;}
.m-meta{font-size:10px;color:var(--gold);letter-spacing:1px;margin-bottom:6px;}
.m-title{font-size:17px;font-weight:700;font-family:"Noto Serif TC",Georgia,serif;margin-bottom:8px;}
.m-desc{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px;}
.m-choice{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:7px;color:var(--text);cursor:pointer;font-size:12px;font-weight:700;}
.m-choice:hover{border-color:var(--gold);}
.cand-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cand-card{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;}
.cand-hd{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.cand-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.cand-nm{font-size:11px;font-weight:700;}
.cand-rt{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;margin-top:1px;}
.ctbl{width:100%;font-size:10px;margin-bottom:7px;}
.ctbl td{padding:2px 0;}
.ctbl td:first-child{color:var(--muted);}
.ctbl td:last-child{text-align:right;}
.c-eval{font-size:10px;color:var(--gold-dim);font-style:italic;margin-bottom:7px;}
.c-hint{font-size:9px;color:var(--teal);display:none;margin-top:3px;}
.c-hint.show{display:block;}
.c-acts{display:flex;gap:5px;}
.c-acts button{flex:1;font-size:10px;padding:5px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:6px;cursor:pointer;}
.c-acts .hire{border-color:var(--gold-dim);color:var(--gold);}
.c-acts button:hover{border-color:var(--gold);}
.ct-card{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;}
.ct-top{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:5px;}
.ct-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:2px 0;}
.ct-btn{margin-top:7px;width:100%;font-size:11px;padding:6px;background:var(--surface);border:1px solid var(--gold-dim);color:var(--gold);border-radius:7px;cursor:pointer;}
.ct-btn:hover{background:rgba(211,164,76,.08);}
.tut-step{font-size:12px;line-height:1.8;color:var(--muted);margin-bottom:10px;padding-left:14px;border-left:2px solid var(--gold-dim);}
.tut-step b{color:var(--gold);}
.ap-frm label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;}
.ap-frm input{background:var(--surface2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px;padding:6px 10px;width:100%;margin-bottom:8px;}
.ap-frm .ap-info{font-size:10px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.btn-cf{background:var(--gold);color:#1a1305;border:none;border-radius:8px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;width:100%;margin-bottom:5px;}
.btn-cc{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:11px;cursor:pointer;width:100%;}

/* RATING COLORS */
.r-彩{background:linear-gradient(135deg,#ff8c8c,#ffd077,#6ee6b0,#7cc8ff,#b89eff);}
.r-紅{background:var(--red);color:#fff;}
.r-金{background:var(--gold);color:#1a1305;}
.r-紫{background:var(--purple);color:#fff;}
.r-藍{background:var(--blue);color:#fff;}
.r-綠{background:var(--green);color:#0a1a10;}
.r-白{background:#5a6b78;color:#fff;}

/* ANIMATIONS */
@keyframes emp-work{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes emp-idle{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
@keyframes emp-worry{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.aw{animation:emp-work 1.4s ease-in-out infinite;}
.ai{animation:emp-idle 2.5s ease-in-out infinite;}
.ar{animation:emp-worry .5s ease-in-out infinite;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--gold-dim);border-radius:8px;padding:8px 16px;font-size:11px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="screen-setup" class="screen active">
  <h1>企業模擬經營</h1>
  <p class="tagline">v1.52 — 選擇你的產業，開始經營</p>
  <div class="ind-grid" id="ind-grid"></div>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <div id="topbar">
    <div>
      <div class="co-name" id="co-name"></div>
      <div class="co-month" id="co-month"></div>
    </div>
    <div class="topbar-r">
      <button class="tbtn" id="btn-sidebar">側欄 ◀</button>
      <button class="tbtn" id="btn-mute">🔊</button>
      <button class="tbtn" id="btn-help">？ 規則</button>
      <button class="tbtn primary" id="btn-next">下一月 ▶</button>
    </div>
  </div>

  <div id="game-body">
    <div id="office-area">
      <div id="boss-row">
        <span id="boss-svg"></span>
        <div class="boss-info">
          <div class="name" id="boss-name">老闆</div>
          <div class="sub" id="boss-sub"></div>
        </div>
        <button class="tbtn" id="btn-gm-appoint" style="display:none">任命總經理</button>
        <div id="gm-node" style="display:none">
          <span id="gm-svg"></span>
          <div><div class="gm-label" id="gm-name"></div><div class="gm-sub" id="gm-sub"></div></div>
        </div>
      </div>
      <div id="rooms-grid"></div>
    </div>

    <div id="side-panel">
      <div id="side-tabs">
        <div class="s-tab active" data-tab="finance">財務</div>
        <div class="s-tab" data-tab="risk">風險</div>
        <div class="s-tab" data-tab="projects">案件</div>
        <div class="s-tab" data-tab="log">紀錄</div>
      </div>
      <div id="side-content"></div>
    </div>
  </div>

  <div id="bottom-bar">
    <div class="bar-sec">
      <div class="bar-sec-lbl">老闆行動（每月各限一次）</div>
      <div class="bactions" id="boss-actions"></div>
    </div>
    <div class="div-v"></div>
    <div class="bar-sec" id="directives-sec">
      <div class="bar-sec-lbl">部門指令</div>
      <div class="dirs-row" id="dirs-row"></div>
    </div>
    <div class="div-v"></div>
    <div class="bar-sec" id="bar-proj">
      <div class="bar-sec-lbl">案件</div>
      <button id="new-proj-btn">+ 洽談新案件</button>
      <div id="proj-cap"></div>
    </div>
    <div style="margin-left:auto;flex-shrink:0;">
      <button class="tbtn" id="side-toggle">◀▶</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   企業模擬經營 v1.52
   架構: CONFIG → ENGINE → STATE → DISPATCH → UI
================================================================ */

/* ============================================================
   CONFIG LAYER — 所有靜態資料,擴展只動這一段
============================================================ */
const CONFIG = {

INDUSTRIES:{
  "品牌廠OEM_ODM":{label:"品牌廠 OEM/ODM",capital:5000,enabled:true,
    desc:"筆電/Monitor/手機/耳機/手錶代工。RFQ流程長，客戶議價力強。",
    stages:["RFI","RFQ","報價議價","EVT","DVT","PVT","認證","MP","量產出貨"],
    stageDuration:[1,1,1,2,2,2,1,1,null],
    stageCost:[10,20,15,50,70,90,30,40,0],
    stageSuccess:[0.9,0.85,0.8,0.75,0.78,0.8,0.85,0.7,null]},
  "PCM":{label:"PCM 精密機構件",capital:1200,enabled:true,
    desc:"開模/試模流程，模具是良率天花板，資本支出集中在前期。",
    stages:["開模","T0試模","修模","T1試模","量產"],
    stageDuration:[2,1,1,1,null],
    stageCost:[60,20,15,20,0],
    stageSuccess:[0.85,0.7,0.8,0.85,null]},
  "材料":{label:"材料",capital:1200,enabled:false,desc:"配方/製程導向，客戶端SQE認證週期長。"},
  "光電":{label:"光電",capital:2500,enabled:false,desc:"良率敏感，設備折舊壓力大。"},
  "半導體":{label:"半導體",capital:10000,enabled:false,desc:"技術門檻最高，前期燒錢期長。"},
  "傳統產業":{label:"傳統產業",capital:300,enabled:false,desc:"門檻低，適合新手教學。"}
},

/* ============================================================
   ENGINE 工具函式
============================================================ */
const rnd=(a,b)=>Math.random()*(b-a)+a;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function avgAbility(dept,field){
  if(!dept||!dept.employees.length)return 50;
  return dept.employees.reduce((a,e)=>a+e.trueAbility[field],0)/dept.employees.length;
}
function allEmps(s){
  const a=s.departments.reduce((acc,d)=>acc.concat(d.employees),[]);
  if(s.gm)a.push(s.gm);
  return a;
}
function avgLoyaltyAll(s){
  const e=allEmps(s);
  return e.length?e.reduce((a,x)=>a+x.loyalty,0)/e.length:50;
}
function deptByKey(s,key){return s.departments.find(d=>d.key===key);}
function moodTier(l){return l>=80?5:l>=60?4:l>=40?3:l>=20?2:1;}
function moodEmoji(l){return{5:"😍",4:"🙂",3:"😐",2:"😟",1:"😠"}[moodTier(l)];}
function moodColor(l){return l>=65?"#4caf6d":l>=40?"#d3a44c":"#cf4a44";}
function moodAnim(l){return l>=65?"aw":l>=40?"ai":"ar";}

function maxProjects(s){
  const d=deptByKey(s,"sales");
  return Math.max(1,d?d.employees.length:1);
}
function replaceEquipCost(s){
  const prod=deptByKey(s,"prod");
  return Math.round(80*(prod?prod.investLevel:1)*(0.5+s.company.equipmentAging));
}
function investCost(dept){const max=dept.key==="prod"?8:5;return dept.investLevel>=max?null:(dept.key==="prod"?120:20)*dept.investLevel;}
function expandCost(dept){return Math.round(20*Math.pow(dept.slots,1.5));}

function pickSchool(s){
  const globalBoost=deptByKey(s,"global")?.unlocked&&deptByKey(s,"global")?.employees.length>0;
  const twRatio=globalBoost?0.35:0.6;
  return Math.random()<twRatio?pick(CONFIG.SCHOOLS_TW):pick(CONFIG.SCHOOLS_GLOBAL);
}
function pickRatingWeighted(dept){
  const lvl=dept?.investLevel||1;
  const weights=CONFIG.RATINGS.map((_,i)=>{
    const base=[9,7,5,3.5,2.5,1.5,0.8][i];
    return i<3?base*(1+0.2*(lvl-1)):base*(1-0.05*(lvl-1));
  });
  const total=weights.reduce((a,w)=>a+w,0);
  let r=Math.random()*total;
  for(let i=0;i<CONFIG.RATINGS.length;i++){if(r<weights[i])return CONFIG.RATINGS[i];r-=weights[i];}
  return CONFIG.RATINGS[CONFIG.RATINGS.length-1];
}

function makeEmployee(position,dept,s){
  const rating=dept?pickRatingWeighted(dept):pick(CONFIG.RATINGS);
  const potential=CONFIG.RATING_POTENTIAL[rating];
  const base=clamp(potential+rnd(-10,10),10,100);
  const school=pickSchool(s||{departments:[]});
  const major=pick(CONFIG.MAJORS);
  const majorRel=major.rel[position]??0.3;
  const expYears=Math.floor(rnd(0,8));
  const baseSalary=CONFIG.POSITION_SALARY[position]||30;
  const salary=Math.round(baseSalary*(0.85+school.score/300)*(0.9+expYears*0.03)*10)/10;
  const evalText=rating==="彩"||rating==="紅"?"不可多得的人才"
    :rating==="金"||rating==="紫"?"條件不錯，值得一試"
    :rating==="藍"||rating==="綠"?"中等水準，穩定可用"
    :"潛力不明，有風險但便宜";
  const gender=Math.random()<0.5?"m":"f";
  return {
    id:"e"+Math.random().toString(36).slice(2,8),
    gender,
    figv:1+Math.floor(Math.random()*4),
    name:(()=>{const g2=gender==="f";return pick(CONFIG.NAMES_F)+pick(g2?CONFIG.NAMES_M_F:CONFIG.NAMES_M)+pick(g2?CONFIG.NAMES_E_F:CONFIG.NAMES_E);})(),
    position,rating,school:school.name,major:major.name,
    traits:[pick(CONFIG.TRAITS)],
    expYears,expectedSalary:salary,evalText,
    trueAbility:{
      technical:clamp(base*(0.6+majorRel*0.6)+rnd(-12,12),10,100),
      sales:clamp(base*(0.6+majorRel*0.6)+rnd(-12,12),10,100),
      management:clamp(base+rnd(-12,12),10,100),
      integrity:clamp(base+rnd(-18,18),5,100)
    },
    loyalty:clamp(rnd(45,65),0,100),
    salary
  };
}

/* ============================================================
   ENGINE — createState
============================================================ */
const SAVE_KEY="sim_save_v1";
function serializeState(s){
  return JSON.stringify({
    v:1,
    industryKey:s.industry.key,
    company:{...s.company,debtRatio:undefined},
    departments:s.departments.map(d=>({key:d.key,unlocked:d.unlocked,slots:d.slots,investLevel:d.investLevel,directive:d.directive,headId:d.headId,employees:d.employees})),
    projects:s.projects,
    eventLog:s.eventLog.slice(0,120),
    hasGM:s.hasGM,gm:s.gm||null,
    _gmEventFired:s._gmEventFired||false
  });
}
function saveGame(s){
  if(!s||s.company.bankrupt)return;
  try{localStorage.setItem(SAVE_KEY,serializeState(s));}catch(e){}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadSaveRaw(){
  try{const r=localStorage.getItem(SAVE_KEY);return r?JSON.parse(r):null;}catch(e){return null;}
}
function restoreState(data){
  const s=createState(data.industryKey);
  Object.keys(data.company).forEach(k=>{if(k!=="debtRatio"&&data.company[k]!==undefined)s.company[k]=data.company[k];});
  data.departments.forEach(sd=>{
    const d=s.departments.find(x=>x.key===sd.key);
    if(!d)return;
    d.unlocked=sd.unlocked;d.slots=sd.slots;d.investLevel=sd.investLevel;
    d.directive=sd.directive;d.headId=sd.headId||null;
    d.employees=sd.employees||[];
  });
  s.projects=data.projects||[];
  s.eventLog=data.eventLog||[];
  s.hasGM=!!data.hasGM;s.gm=data.gm||null;
  s._gmEventFired=!!data._gmEventFired;
  return s;
}
function createState(industryKey){
  const industry=CONFIG.INDUSTRIES[industryKey];
  const departments=CONFIG.DEPT_DEFS.map(def=>{
    const dept={
      key:def.key,name:def.name,color:def.color,
      unlocked:def.unlocked,cost:def.cost,headPos:def.headPos,
      slots:def.startSlots,investLevel:1,
      directive:CONFIG.DIRECTIVES[def.key]?.[0].id||null,
      employees:[],headId:null,
      unlockCheck:def.unlockCheck,unlockHint:def.unlockHint,
      kpis:def.kpis,effects:def.effects
    };
    dept.employees=def.startEmps.map(p=>makeEmployee(p,dept,{departments:[]}));
    return dept;
  });

  const s={
    industry:{key:industryKey,...industry},
    company:{
      name:industry.label+" 工業",
      month:0,
      cash:industry.capital,debt:0,equity:industry.capital,
      capital:industry.capital,retained:0,revHistory:[],
      graceMonths:0,ratePenalty:0,bankrupt:false,
      stats:{maxRevenue:0,maxNet:0,bestMonth:0},
      interestRate:0.02,investmentFrozen:false,
      baseYieldRate:70,trueYieldRate:70,reportedYieldRate:70,
      noiseAmp:0.25,
      equipmentAging:0.05,returnRate:0.02,customerTrust:55,
      trueRisk:{財務造假:5,勞檢:5,品質掩蓋:5,採購舞弊:5},
      reportedRisk:{財務造假:5,勞檢:5,品質掩蓋:5,採購舞弊:5},
      completedContracts:0,consecutivePositiveMonths:0,
      bossActions:{inspect:false,borrow:false,repay:false,negotiate:false},
      inspectMode:null
    },
    departments,
    projects:[],
    hasGM:false,gm:null,_gmEventFired:false,_pendingEventShown:null,
    lastFin:null,
    eventLog:[],
    ui:{pendingEvents:[],pendingContracts:[],modal:null,sideTab:"finance",sideOpen:true,
        tempCandidates:[],tempContractProject:null}
  };
  s.company.debtRatio=function(){return this.debt/(this.debt+this.equity+1);};
  s.log=function(tag,msg){this.eventLog.unshift({tag,msg,month:this.company.month});};
  const firstProj=makeProject(s);
  firstProj.stageIndex=industry.stages.length-1;
  firstProj.stageMonthsLeft=null;
  const fpBase=industryKey==="PCM"?40:100;
  firstProj.contract={customer:"老客戶 - 創業首單",price:Math.round(fpBase*0.6),volume:8,months:6,monthsLeft:6,totalMonths:6};
  s.projects.push(firstProj);
  s.log("成立",`「${s.company.name}」正式創立，帶著老客戶的一張首單開始營運（${firstProj.contract.volume}件/月，為期6個月）。`);
  const secondProj=makeProject(s);
  s.projects.push(secondProj);
  s.log("業務",`新案件「${secondProj.customer}」同步開始洽談開發。`);
  return s;
}

function makeProject(s){
  return{
    id:"pj"+Math.random().toString(36).slice(2,8),
    customer:pick(CONFIG.CUSTOMERS),
    stageIndex:0,stageMonthsLeft:s.industry.stageDuration[0],
    contract:null
  };
}

/* ============================================================
   ENGINE — advanceMonth (main game loop)
============================================================ */
function deptHead(d){
  if(!d||!d.employees.length)return null;
  if(d.headId){const h=d.employees.find(e=>e.id===d.headId);if(h)return h;d.headId=null;}
  return d.employees.reduce((a,e)=>e.trueAbility.management>a.trueAbility.management?e:a,d.employees[0]);
}
function headBonus(d){
  if(!d)return 0;
  const h=d.headId?d.employees.find(e=>e.id===d.headId):null;
  if(!h)return 0; /* 只有正式任命的主管才有加成 */
  return (h.trueAbility.management-50)/100;
}
function netWorth(c){return Math.max(0,c.capital+c.retained);}
function creditLimit(c){
  const avgRev=c.revHistory.length?c.revHistory.reduce((a,b)=>a+b,0)/c.revHistory.length:0;
  return Math.round(netWorth(c)*1.5+avgRev*3);
}
function baseRate(c){
  const r=c.debt/Math.max(1,netWorth(c));
  return r<0.5?0.02:r<1?0.04:0.07;
}
function advanceMonth(s){
  s.company.month++;
  const c=s.company;
  c.bossActions={inspect:false,borrow:false,repay:false,negotiate:false};
  c.inspectMode=null;
  c.investmentFrozen=false;
  c.interestRate=baseRate(c)+c.ratePenalty;
  s.ui.monthCands={};s.ui.monthBulk={};

  // Risk decay
  const riskDecay={財務造假:0.025,勞檢:0.04,品質掩蓋:0.03,採購舞弊:0.02};
  Object.keys(c.trueRisk).forEach(k=>{c.trueRisk[k]=clamp(c.trueRisk[k]*(1-riskDecay[k]),0,100);});
  checkRumors(s);
  if(c.month>0&&c.month%12===0)s.ui.pendingEvents.push({ev:yearEndEvent(s),ctx:{}});

  // Equipment aging — prod directive "maintain" slows it
  const prod=deptByKey(s,"prod");
  const agingBase=0.012;
  const agingDelta=prod?.effects.agingDelta?.(prod)||0;
  c.equipmentAging=clamp(c.equipmentAging+agingBase+agingDelta,0,1);

  // Directive side effects (training / safety / culture)
  applyDirectiveSideEffects(s);

  // Advance all project stages
  s.projects.forEach(p=>advanceProjectStage(p,s));

  // Monthly financials
  calcMonthly(s);

  // Loyalty drift
  s.departments.forEach(d=>{
    const hb=headBonus(d);
    d.employees.forEach(e=>{
      const expect=(CONFIG.POSITION_SALARY[e.position]||4)*(0.75+e.trueAbility.technical/200);
      const gap=(e.salary-expect)/Math.max(0.5,expect);
      const salaryEffect=clamp(gap*5,-4,4);
      e.loyalty=clamp(e.loyalty+rnd(-2,1)+salaryEffect+hb*2,0,100);
    });
  });
  if(s.gm)s.gm.loyalty=clamp(s.gm.loyalty+rnd(-2,1),0,100);

  // GM auto-spawn
  checkGMSpawn(s);

  // Roll events
  rollEvents(s);

  // Queue contracts for projects that just hit MP
  s.projects.forEach(p=>{
    const lastIdx=s.industry.stages.length-1;
    if(p.stageIndex===lastIdx&&!p.contract&&!s.ui.pendingContracts.includes(p.id)){
      s.ui.pendingContracts.push(p.id);
    }
  });
}

function applyDirectiveSideEffects(s){
  const rd=deptByKey(s,"rd");
  if(rd?.directive==="train"&&rd.employees.length&&Math.random()<0.45){
    const e=pick(rd.employees);
    // Diminishing returns: harder to grow at high values
    const growCap=1-e.trueAbility.technical/120;
    e.trueAbility.technical=clamp(e.trueAbility.technical+rnd(1,3)*growCap,0,100);
    s.log("研發",`「${e.name}」的技術力小幅成長。`);
  }
  const prod=deptByKey(s,"prod");
  if(prod?.directive==="safety"&&prod.employees.length){
    prod.employees.forEach(e=>e.loyalty=clamp(e.loyalty+1.5,0,100));
  }
  const global_=deptByKey(s,"global");
  if(global_?.directive==="culture"&&global_.employees.length){
    global_.employees.forEach(e=>e.loyalty=clamp(e.loyalty+2,0,100));
    s.company.customerTrust=clamp(s.company.customerTrust+0.5,0,100);
  }
}

function advanceProjectStage(p,s){
  const ind=s.industry;
  if(p.stageIndex>=ind.stages.length-1)return;
  p.stageMonthsLeft--;
  if(p.stageMonthsLeft>0)return;
  const rd=deptByKey(s,"rd");
  const stageSuccessBonus=(rd?.effects.stageSuccessBonus?.(rd)||0)+headBonus(rd)*0.15*(s._gmAmp||1);
  const techCoeff=0.6+(avgAbility(rd,"technical")/100)*0.6+stageSuccessBonus;
  const baseRate=ind.stageSuccess[p.stageIndex];
  const adjRate=clamp(baseRate*techCoeff,0.2,0.97);
  const cost=ind.stageCost[p.stageIndex]||0;
  s.company.cash-=cost;
  if(Math.random()<adjRate){
    p.stageIndex++;
    p.stageMonthsLeft=ind.stageDuration[p.stageIndex];
    const stageName=ind.stages[p.stageIndex-1];
    const nre=Math.round(cost+rnd(15,35));
    s._nre=(s._nre||0)+nre;
    s.log("製程",`「${p.customer}」案件:「${stageName}」通過，進入「${ind.stages[p.stageIndex]}」。客戶支付 NRE 開發費 ${nre} 萬。`);
    if(p.stageIndex===ind.stages.length-1)s.log("製程",`「${p.customer}」案件量產正式開始，需要洽談合約。`);
  } else {
    p.stageMonthsLeft=1;
    s.company.cash-=cost*0.5;
    s.log("製程",`「${p.customer}」案件「${ind.stages[p.stageIndex]}」未通過驗證，需重工。`);
  }
}

function calcMonthly(s){
  const c=s.company;
  const rd=deptByKey(s,"rd"),sales=deptByKey(s,"sales"),prod=deptByKey(s,"prod");
  const qa=deptByKey(s,"qa"),proc=deptByKey(s,"proc"),fin=deptByKey(s,"fin");
  const avgTech=avgAbility(rd,"technical");
  const avgSales=avgAbility(sales,"sales");
  const rdHead=deptHead(rd);
  const headMgmt=rdHead?rdHead.trueAbility.management:50;
  const headIntegrity=rdHead?rdHead.trueAbility.integrity:50;

  // Yield
  const yieldBonus=(prod?.effects.yieldBonus?.(prod)||0)+headBonus(prod)*0.1*(s._gmAmp||1);
  const engineerCoeff=0.4+(avgTech/100)*0.8+yieldBonus;
  c.trueYieldRate=clamp(c.baseYieldRate*engineerCoeff*(1-c.equipmentAging*0.4),20,99);

  // Noise / reporting distortion
  let noiseAmp=(1-headMgmt/100)*0.3;
  let integrityGap=(100-headIntegrity)/100;
  let gmAmp=1;
  if(s.hasGM&&s.gm){
    const gmM=s.gm.trueAbility.management;
    if(gmM>70)gmAmp=1+(gmM-70)/100; /* 強GM：主管加成放大 1.0~1.3 */
    else noiseAmp+=(70-gmM)/100*0.25; /* 弱GM：回報更失真 */
    integrityGap=clamp(integrityGap+(100-s.gm.trueAbility.integrity)/100*0.3,0,1.5);
  }
  s._gmAmp=gmAmp;
  const finNoiseDelta=(fin?.unlocked&&fin.employees.length)?(fin.effects.noiseAmpDelta?.(fin)||0):0;
  noiseAmp=Math.max(0,noiseAmp+finNoiseDelta);
  c.noiseAmp=noiseAmp;
  const biasMag=integrityGap*0.18;
  c.reportedYieldRate=clamp(c.trueYieldRate*(1+(rnd(-1,1)*noiseAmp+biasMag)),20,99);
  const riskBias=-integrityGap*12;
  Object.keys(c.trueRisk).forEach(k=>{
    const n=(rnd(-1,1)*noiseAmp*c.trueRisk[k])+riskBias;
    c.reportedRisk[k]=clamp(c.trueRisk[k]+n,0,100);
  });

  // Dept risk effects
  if(proc?.unlocked&&proc.employees.length){
    const delta=proc.effects.riskDelta?.採購舞弊?.(proc)||0;
    c.trueRisk.採購舞弊=clamp(c.trueRisk.採購舞弊+delta,0,100);
  }
  if(fin?.unlocked&&fin.employees.length){
    Object.entries(fin.effects.riskDelta||{}).forEach(([k,fn])=>{
      c.trueRisk[k]=clamp(c.trueRisk[k]+fn(fin),0,100);
    });
  }

  // Return rate (QA)
  let returnRateDelta=qa?.unlocked&&qa.employees.length?(qa.effects.returnRateDelta?.(qa)||0):0;
  returnRateDelta-=headBonus(qa)*0.005*(s._gmAmp||1);
  c.returnRate=clamp(0.02+returnRateDelta,0.005,0.05);

  // COGS rate
  let cogsRate=0.55;
  const procBonus=(proc?.unlocked&&proc.employees.length)?(proc.effects.cogsRateBonus?.(proc)||0):0;
  const salesBonus=sales?.effects.cogsRateBonus?.(sales)||0;
  cogsRate=clamp(0.55+procBonus+salesBonus,0.35,0.62);

  // Customer trust from depts
  const salesTrustDelta=sales?.effects.customerTrustDelta?.(sales)||0;
  const qaTrustDelta=qa?.unlocked?(qa.effects.customerTrustDelta?.(qa)||0):0;
  const investTrickle=s.departments.reduce((a,d)=>a+(d.unlocked?(d.investLevel-1):0),0)*0.04;
  c.customerTrust=clamp(c.customerTrust+salesTrustDelta+qaTrustDelta+investTrickle,0,100);

  // Sales art bonus
  const salesArtBonus=(avgSales/100)*0.25+(sales?(sales.investLevel-1)*0.02:0)+headBonus(sales)*0.1*(s._gmAmp||1);

  // Capacity：勞動力（領班覆蓋）與設備，取小者
  const prodN=prod?prod.employees.length:0;
  const pHead=(prod&&prod.headId)?prod.employees.find(e=>e.id===prod.headId):null;
  const coveredN=pHead?Math.floor(pHead.trueAbility.management/10):3;
  const uncovered=Math.max(0,prodN-coveredN);
  const effWorkers=Math.min(prodN,coveredN)+uncovered*0.5;
  const laborCap=Math.round(effWorkers*8*(avgTech/70||1));
  const equipCap=(prod?prod.investLevel:1)*60;
  const totalCapacity=Math.min(laborCap,equipCap);
  s._capInfo={laborCap,equipCap,coveredN,uncovered,prodN};
  const lastIdx=s.industry.stages.length-1;
  const activeProj=s.projects.filter(p=>p.stageIndex===lastIdx&&p.contract);
  const totalDemand=activeProj.reduce((a,p)=>a+p.contract.volume,0);
  const capRatio=totalDemand>totalCapacity&&totalDemand>0?totalCapacity/totalDemand:1;
  if(capRatio<1)s.log("產能",`本月產能(${totalCapacity}件${laborCap<equipCap?"，人力受限":"，設備受限"})不足以滿足需求(${totalDemand}件)，已按比例分配。`);
  if(uncovered>0&&prodN>0)s.log("產能",`產線 ${uncovered} 人缺乏領班督導，效率減半。`);

  // Yield（第二段）：品保覆蓋 / 產線負荷 / 領班督導
  const qaN=(qa?.unlocked)?qa.employees.length:0;
  const qaNeed=Math.max(1,prodN/8);
  const qaCover=Math.min(1,qaN/qaNeed);
  const coverCoeff=0.85+0.15*qaCover;
  const load=totalCapacity>0?totalDemand/totalCapacity:0;
  const loadCoeff=load<=1?1:Math.max(0.6,1-(load-1)*0.5);
  const foremanCoeff=prodN>0?1-(uncovered/prodN)*0.15:1;
  c.trueYieldRate=clamp(c.trueYieldRate*coverCoeff*loadCoeff*foremanCoeff,20,99);
  s._qaCover=qaCover;
  let reworkMult=1;
  if(c.trueYieldRate<90&&c.trueYieldRate>=75){
    reworkMult=1.35;
    s.log("品質",`良率僅 ${c.trueYieldRate.toFixed(0)}%，本月訂單需重工，成本上升 35%。`);
  } else if(c.trueYieldRate<75&&activeProj.length){
    reworkMult=1.5;
    if(c.month>4&&(!c._rwCd||c._rwCd<=0)){
      c._rwCd=6;
      s.ui.pendingEvents.push({ev:RETURN_WAVE_EVENT,ctx:{}});
    }
  }
  if(c._rwCd>0)c._rwCd--;

  let revenue=0,cogsTotal=0;
  const nre=s._nre||0;s._nre=0;
  revenue+=nre;
  const interest=c.debt*c.interestRate/12;
  activeProj.forEach(p=>{
    const effVol=Math.max(0,Math.round(p.contract.volume*capRatio));
    if(effVol<p.contract.volume)c.customerTrust=clamp(c.customerTrust-2,0,100);
    const effPrice=p.contract.price*(1+salesArtBonus);
    const rev=effVol*effPrice*(c.trueYieldRate/100)*(1-c.returnRate);
    revenue+=rev;cogsTotal+=rev*cogsRate*reworkMult;
    p.contract.monthsLeft--;
    if(p.contract.monthsLeft<=0){
      s.log("合約",`「${p.customer}」案件的合約已結束，需洽談新合約。`);
      p.contract=null;
      c.completedContracts++;
    }
  });

  const totalSalary=allEmps(s).reduce((a,e)=>a+e.salary,0);
  let net;
  if(activeProj.length>0){
    net=revenue-cogsTotal-totalSalary-interest;
    c.cash+=net;c.equity+=net;
  } else {
    const opex=totalSalary*0.6;
    net=nre-opex;c.cash+=net;c.equity+=net;
  }
  c.consecutivePositiveMonths=net>0?c.consecutivePositiveMonths+1:0;
  c.retained+=net;
  c.revHistory.push(revenue);
  if(c.revHistory.length>12)c.revHistory.shift();
  if(revenue>c.stats.maxRevenue){c.stats.maxRevenue=revenue;c.stats.bestMonth=c.month;}
  if(net>c.stats.maxNet)c.stats.maxNet=net;
  s.lastFin={revenue,cogs:cogsTotal,opex:totalSalary,interest,net,
    capacity:totalCapacity,demand:totalDemand,cogsRate};
}

function yearEndEvent(s){
  const hc=allEmps(s).length+(s.hasGM?1:0);
  const c1=Math.round(hc*3),c2=Math.round(hc*1.5),c3=Math.round(hc*0.5);
  return{
    name:"年終尾牙",bucket:"人事",
    desc:`一年又過去了，全公司 ${hc} 人都在看老闆的誠意。尾牙的規格，員工都會記在心裡。`,
    options:[
      {label:`高級飯店尾牙＋抽獎（${c1} 萬）`,eff:(s)=>{s.company.cash-=c1;allEmps(s).forEach(e=>e.loyalty=clamp(e.loyalty+15,0,100));if(s.gm)s.gm.loyalty=clamp(s.gm.loyalty+15,0,100);s.log("人事","盛大尾牙賓主盡歡，全員士氣大振。");}},
      {label:`餐廳包場尾牙（${c2} 萬）`,eff:(s)=>{s.company.cash-=c2;allEmps(s).forEach(e=>e.loyalty=clamp(e.loyalty+8,0,100));if(s.gm)s.gm.loyalty=clamp(s.gm.loyalty+8,0,100);s.log("人事","尾牙圓滿結束，員工反應不錯。");}},
      {label:`辦公室加菜金（${c3} 萬）`,eff:(s)=>{s.company.cash-=c3;allEmps(s).forEach(e=>e.loyalty=clamp(e.loyalty+3,0,100));s.log("人事","小小心意，聊勝於無。");}},
      {label:"今年不辦（共體時艱）",eff:(s)=>{allEmps(s).forEach(e=>e.loyalty=clamp(e.loyalty-8,0,100));if(s.gm)s.gm.loyalty=clamp(s.gm.loyalty-8,0,100);s.log("人事","尾牙取消，茶水間怨聲載道。");}}
    ]
  };
}
const RETURN_WAVE_EVENT={
  name:"退貨潮",bucket:"品質掩蓋",
  desc:"良率跌破 75%，多家客戶陸續退貨並要求賠償。客戶的品質工程師已經進駐稽核。",
  options:[
    {label:"全面召回並賠償（傷錢，保信譽）",eff:(s)=>{
      const dmg=Math.round((s.lastFin?.revenue||100)*0.4);
      s.company.cash-=dmg;
      s.company.customerTrust=clamp(s.company.customerTrust-5,0,100);
      s.log("品質",`召回賠償支出 ${dmg} 萬。`);}},
    {label:"與客戶硬拗品質標準（省錢，賭信任）",eff:(s)=>{
      s.company.customerTrust=clamp(s.company.customerTrust-15,0,100);
      s.company.trueRisk.品質掩蓋=clamp(s.company.trueRisk.品質掩蓋+20,0,100);}}
  ]
};
const RUMOR_TEXT={
  品質掩蓋:{t1:"產線私下傳言：有批不良品沒照程序報廢就出貨了。",t2:"大客戶的稽核團隊來電，詢問幾筆異常的良率數字。"},
  勞檢:{t1:"茶水間聽說：有員工向勞工局申訴加班問題。",t2:"勞檢員最近在園區頻繁出沒，同業已有人被開罰。"},
  採購舞弊:{t1:"傳聞某供應商跟我們的採購人員走得很近。",t2:"落選的供應商私下抱怨：「沒送禮根本拿不到單。」"},
  財務造假:{t1:"會計師事務所對幾筆帳目提出了疑問。",t2:"往來銀行突然要求補提供近期的財務資料。"}
};
function checkRumors(s){
  const c=s.company;
  c._rumorFired=c._rumorFired||{};
  let level=0;
  Object.keys(c.trueRisk).forEach(k=>{
    const v=c.trueRisk[k];
    const f=c._rumorFired[k]=c._rumorFired[k]||{t1:false,t2:false};
    if(v>=40&&!f.t1){f.t1=true;s.log("傳聞",RUMOR_TEXT[k].t1);}
    if(v>=70&&!f.t2){f.t2=true;s.log("傳聞",RUMOR_TEXT[k].t2);AUDIO.sfx("ding");}
    if(v<30)f.t1=false;
    if(v<60)f.t2=false;
    if(v>=70)level=Math.max(level,2);
    else if(v>=40)level=Math.max(level,1);
  });
  s._rumorLevel=level;
}
function checkGMSpawn(s){
  if(s.hasGM||s._gmEventFired)return;
  const hc=s.departments.reduce((a,d)=>a+d.employees.length,0);
  if(hc>=10){
    s._gmEventFired=true;
    s.ui.pendingEvents.unshift({ev:GM_APPOINT_EVENT,ctx:{headcount:hc}});
  }
}

function promoteInternalGM(s){
  const allE=s.departments.reduce(function(a,d){return a.concat(d.employees);},[]);
  if(!allE.length){s.log("組織","沒有可提拔的員工。");return;}
  const top=allE.slice().sort(function(a,b){return b.trueAbility.management-a.trueAbility.management;}).slice(0,3);
  top.forEach(function(e){_regEmp(e);});
  // Store top candidates for deferred DOM injection
  window._gmCandidates=top;
  openModal(
    "<div class='m-meta'>內部提拔</div>"+
    "<div class='m-title'>選擇一位員工升任總經理</div>"+
    "<div class='m-desc'>升任後，你對部門的直接掌控感會下降——視察所得的資訊會先經過他的篩選。</div>"+
    "<div id='gm-cand-list'></div>"+
    "<button class='m-choice' style='margin-top:10px' onclick='dispatch(\"CLOSE_MODAL\")'>先不任命（維持現狀）</button>"
  );
  // Build list after DOM is ready
  const list=document.getElementById('gm-cand-list');
  if(list){
    top.forEach(function(e){
      const mgmt=Math.round(e.trueAbility.management);
      const tech=Math.round(e.trueAbility.technical);
      const div=document.createElement('div');
      div.className='emp-list-item';
      div.style.cursor='pointer';
      div.innerHTML='<div>'+empSVG(e,18,26)+'</div>'+
        '<div class="eli-info">'+
          '<div class="nm">'+e.name+' ['+e.rating+'] '+moodEmoji(e.loyalty)+'</div>'+
          '<div class="sub">'+e.position+' ・ 管理力 '+mgmt+' ・ 技術力 '+tech+'</div>'+
        '</div>';
      const eid=e.id;
      div.addEventListener('click',function(){_appointGM(eid);});
      list.appendChild(div);
    });
  }
}

function _appointGM(empId){
  const s=STATE;
  // Remove from dept
  for(const d of s.departments){
    const idx=d.employees.findIndex(e=>e.id===empId);
    if(idx>=0){
      s.gm=d.employees[idx];
      d.employees.splice(idx,1);
      break;
    }
  }
  if(!s.gm)return;
  // Promote: salary bump + loyalty shift
  s.gm.position="總經理";
  s.gm.salary=Math.max(s.gm.salary,CONFIG.POSITION_SALARY["總經理"]||25);
  // Internal promotion often boosts loyalty
  s.gm.loyalty=Math.min(100,s.gm.loyalty+15);
  s.hasGM=true;
  if(!s.gm.growthLog)s.gm.growthLog=[];
  s.gm.growthLog.unshift({month:s.company.month,field:"management",fieldLabel:"管理力（升任加成）",delta:3});
  s.gm.trueAbility.management=Math.min(100,s.gm.trueAbility.management+3);
  AUDIO.sfx("fanfare");
  s.log("組織","「"+s.gm.name+"」從內部提拔升任總經理。");
  closeModal();
  renderAll();
}

function rollEvents(s){
  const rp={財務造假:{k:0.03,n:2.5},勞檢:{k:0.02,n:2},品質掩蓋:{k:0.0275,n:2.5},採購舞弊:{k:0.0325,n:2.5}};
  for(const ev of CONFIG.EVENT_POOL){
    try{
      if(!ev.cond(s))continue;
      let prob=ev.baseProb;
      const rk=rp[ev.bucket];
      if(rk){const rv=s.company.trueRisk[ev.bucket]/100||0;prob+=rk.k*Math.pow(rv,rk.n);}
      if(Math.random()>prob)continue;
      let ctx=null;
      if(ev.resolve){ctx=ev.resolve(s);if(!ctx)continue;}
      s.ui.pendingEvents.push({ev,ctx});
    }catch(e){}
  }
}

function calcEnterpriseIndex(s){
  const c=s.company;
  const equity=Math.max(1,c.equity);
  const scalePts=clamp(Math.log10(equity)/Math.log10(50000)*100,0,100);
  const f=s.lastFin;
  const netMargin=f&&f.revenue>0?f.net/f.revenue:0;
  const finHealth=clamp(50+netMargin*100-c.debtRatio()*50,0,100);
  const riskAvg=Object.values(c.trueRisk).reduce((a,v)=>a+v,0)/4;
  const reputation=clamp(c.customerTrust-riskAvg*0.3,0,100);
  return Math.round(scalePts*0.4+finHealth*0.2+reputation*0.2+avgLoyaltyAll(s)*0.2);
}

const AUDIO={
  BASE:"assets/audio/sim/",
  muted:(function(){try{return localStorage.getItem("sim_muted")==="1";}catch(e){return false;}})(),
  ctx:null,unlocked:false,
  bgmEl:null,bgmTrack:null,bgmStarted:false,bgmPending:null,bgmOk:true,_fadeTimer:null,_crisis:false,
  _ctx(){
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      this.ctx=new AC();
    }
    if(this.ctx.state==="suspended")this.ctx.resume();
    return this.ctx;
  },
  unlock(){
    if(this.unlocked)return;
    this.unlocked=true;
    this._ctx();
    if(this.bgmPending){const t=this.bgmPending;this.bgmPending=null;this.bgm(t);}
  },
  toggleMute(){
    this.muted=!this.muted;
    try{localStorage.setItem("sim_muted",this.muted?"1":"0");}catch(e){}
    if(this.bgmEl)this.bgmEl.muted=this.muted;
    const b=document.getElementById("btn-mute");
    if(b)b.textContent=this.muted?"🔇":"🔊";
  },
  /* --- 合成音效 --- */
  _tone(t0,f0,f1,dur,type,vol,curve){
    const c=this.ctx;if(!c)return;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||"square";
    o.frequency.setValueAtTime(f0,t0);
    if(f1&&f1!==f0){
      if(curve==="exp")o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
      else o.frequency.linearRampToValueAtTime(f1,t0+dur);
    }
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol||0.12,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t0);o.stop(t0+dur+0.02);
  },
  sfx(name){
    if(this.muted)return;
    const c=this._ctx();if(!c)return;
    const t=c.currentTime+0.01,T=this._tone.bind(this);
    switch(name){
      case "click": T(t,880,660,0.06,"square",0.06); break;
      case "page":  T(t,440,520,0.07,"square",0.09); T(t+0.08,520,660,0.09,"square",0.09); break;
      case "coin":  T(t,988,988,0.07,"square",0.10); T(t+0.08,1319,1319,0.16,"square",0.10); break;
      case "loss":  T(t,330,196,0.28,"sawtooth",0.10,"exp"); break;
      case "hire":  [523,659,784].forEach((f,i)=>T(t+i*0.07,f,f,0.09,"square",0.09)); break;
      case "leave": T(t,660,330,0.35,"triangle",0.11,"exp"); break;
      case "ding":  T(t,1047,1047,0.10,"sine",0.12); T(t+0.10,1319,1319,0.22,"sine",0.10); break;
      case "alarm": T(t,220,220,0.16,"sawtooth",0.11); T(t+0.20,220,220,0.16,"sawtooth",0.11); T(t+0.40,175,175,0.30,"sawtooth",0.11); break;
      case "fanfare":[392,523,659,784].forEach((f,i)=>T(t+i*0.09,f,f,0.12,"square",0.10)); break;
      case "victory":[523,659,784,1047,784,1047].forEach((f,i)=>T(t+i*0.10,f,f,0.13,"square",0.10)); break;
    }
  },
  /* --- BGM --- */
  bgm(track){
    if(!track||!this.bgmOk)return;
    if(!this.unlocked){this.bgmPending=track;return;}
    if(this.bgmTrack===track&&this.bgmStarted)return;
    this.bgmTrack=track;
    if(!this.bgmEl){
      this.bgmEl=new Audio();
      this.bgmEl.loop=true;
      this.bgmEl.volume=0.35;
      this.bgmEl.muted=this.muted;
      this.bgmEl.onerror=()=>{this.bgmOk=false;this.bgmStarted=false;};
    }
    const el=this.bgmEl,self=this;
    clearInterval(this._fadeTimer);
    const swap=function(){
      el.src=self.BASE+track+".mp3";
      el.volume=0.0;
      self.bgmStarted=false;
      el.play().then(function(){
        self.bgmStarted=true;
        clearInterval(self._fadeTimer);
        self._fadeTimer=setInterval(function(){
          el.volume=Math.min(0.35,el.volume+0.05);
          if(el.volume>=0.35)clearInterval(self._fadeTimer);
        },60);
      }).catch(function(){self.bgmStarted=false;});
    };
    if(this.bgmStarted&&!el.paused){
      this._fadeTimer=setInterval(function(){
        el.volume=Math.max(0,el.volume-0.06);
        if(el.volume<=0){clearInterval(self._fadeTimer);swap();}
      },50);
    } else swap();
  },
  crisisOn(){if(!this._crisis){this._crisis=true;this.bgm("bgm_crisis");}},
  crisisOff(){if(this._crisis){this._crisis=false;this.bgm("bgm_main");}}
};

function dispatch(action,payload={}){
  const s=STATE;
  switch(action){

    case "CONTINUE_GAME":{
      const sv=loadSaveRaw();
      if(!sv){toast("找不到存檔。");return;}
      STATE=restoreState(sv);
      document.getElementById("screen-setup").classList.remove("active");
      document.getElementById("screen-game").classList.add("active");
      renderAll();
      AUDIO.bgm("bgm_main");
      toast(`歡迎回來 — 第 ${STATE.company.month} 月`);
      break;
    }

    case "START_GAME":
      STATE=createState(payload.industryKey);
      clearSave();
      document.getElementById("screen-setup").classList.remove("active");
      document.getElementById("screen-game").classList.add("active");
      renderAll();
      showTutorial();
      AUDIO.bgm("bgm_main");
      break;

    case "NEXT_MONTH":{
      if(isModalOpen())return;
      if(STATE.company.bankrupt)return;
      advanceMonth(STATE);
      AUDIO.sfx("page");
      const fin=STATE.lastFin;
      if(fin){
        if(fin.net>0)setTimeout(()=>AUDIO.sfx("coin"),200);
        else if(fin.net<0&&fin.revenue>0)setTimeout(()=>AUDIO.sfx("loss"),200);
      }
      const cpm=STATE.company.consecutivePositiveMonths;
      if(cpm===3||cpm===6||cpm===12)setTimeout(()=>AUDIO.sfx("victory"),500);
      renderAll();
      checkSolvency(STATE);
      saveGame(STATE);
      if(!isModalOpen())processUIQueue();
      break;
    }

    case "INSPECT":{
      if(s.company.bossActions.inspect){toast("本月已視察過了。");return;}
      s.company.bossActions.inspect=true;
      s.company.inspectMode=s.hasGM?"partial":"full";
      s.log("視察",s.hasGM?"老闆視察部門，但資訊先經過總經理篩選，只看到部分真相。":"老闆親自視察部門，本月取得真實數據。");
      const c=s.company,partial=s.hasGM;
      const rows=[{n:"良率",r:c.reportedYieldRate,t:c.trueYieldRate,unit:"%",badHigh:false}]
        .concat(Object.keys(c.trueRisk).map(k=>({n:k+"風險",r:c.reportedRisk[k],t:c.trueRisk[k],unit:"",badHigh:true})));
      const trs=rows.map(v=>{
        const act=partial?(v.t+v.r)/2:v.t;
        const gap=act-v.r;
        const bad=v.badHigh?gap>8:gap<-8;
        const gapTxt=(gap>0?"+":"")+gap.toFixed(1);
        return `<tr><td>${v.n}</td><td style="text-align:right">${v.r.toFixed(1)}${v.unit}</td><td style="text-align:right">${act.toFixed(1)}${v.unit}</td><td style="text-align:right;color:${bad?"var(--red)":Math.abs(gap)>4?"var(--orange)":"var(--muted)"}">${gapTxt}</td></tr>`;
      }).join("");
      openModal(`<div class="m-meta">老闆行動 · 視察</div>
        <div class="m-title">🔍 視察結果${partial?"（經總經理篩選的折中值）":""}</div>
        <table class="ctbl" style="width:100%"><tr style="color:var(--muted)"><td>項目</td><td style="text-align:right">回報值</td><td style="text-align:right">${partial?"折中值":"實際值"}</td><td style="text-align:right">落差</td></tr>${trs}</table>
        <div class="m-desc" style="margin-top:8px;font-size:10px">${partial?"總經理已經替你「整理」過數字——想看到未經修飾的真相，只能在沒有總經理時親自視察。":"落差大的項目，代表回報體系正在美化數字。"}本月側欄與部門卡片將顯示${partial?"折中":"真實"}數據。</div>
        <button class="m-choice" onclick="dispatch('CLOSE_MODAL')">知道了</button>`);
      renderAll();
      break;
    }

    case "BORROW":{
      if(s.company.bossActions.borrow&&!payload.emergency){toast("本月已借款過了。");return;}
      const lim=creditLimit(s.company);
      const avail=Math.max(0,lim-Math.round(s.company.debt));
      if(avail<=0){toast("授信額度已用盡，銀行拒絕放款。");return;}
      showAPModal("向銀行借款","借款金額（萬）",Math.min(100,avail),avail,
        `授信額度：${lim} 萬（淨值×1.5＋近12月均營收×3）<br>已借：${Math.round(s.company.debt)} 萬｜可借：${avail} 萬<br>目前利率：${(s.company.interestRate*100).toFixed(1)}% / 年（隨負債/淨值比浮動）`,
        amt=>{amt=Math.min(amt,avail);s.company.bossActions.borrow=true;s.company.cash+=amt;s.company.debt+=amt;s.log("財務",`借款 ${amt} 萬。`);});
      break;
    }

    case "REPAY":
      if(s.company.bossActions.repay){toast("本月已還款過了。");return;}
      if(s.company.debt<=0){toast("目前無負債。");return;}
      showAPModal("還款","還款金額（萬）",Math.min(50,s.company.debt),s.company.debt,
        `目前負債：${s.company.debt.toFixed(1)} 萬`,
        amt=>{if(amt>s.company.cash){toast("現金不足。");return;}s.company.bossActions.repay=true;s.company.cash-=amt;s.company.debt=Math.max(0,s.company.debt-amt);s.log("財務",`還款 ${amt} 萬。`);});
      break;

    case "NEGOTIATE":{
      if(s.company.bossActions.negotiate){toast("本月已議價過了。");return;}
      const tgt=s.projects.find(p=>p.contract);
      if(!tgt){toast("目前沒有合約可議價。");return;}
      s.company.bossActions.negotiate=true;
      const sales=deptByKey(s,"sales");
      const chance=0.5+(sales?(sales.investLevel-1)*0.05:0);
      if(Math.random()<chance){
        const bonus=Math.round(tgt.contract.price*rnd(0.04,0.08));
        tgt.contract.price+=bonus;
        s.log("議價",`「${tgt.customer}」合約單價提升 ${bonus} 萬。`);
        toast(`議價成功！單價 +${bonus} 萬`);
      } else {
        s.company.customerTrust=clamp(s.company.customerTrust-4,0,100);
        s.log("議價","議價未果，客戶信任小幅下降。");
        toast("議價失敗，客戶有點不悅。");
      }
      renderAll();
      break;
    }

    case "SET_DIRECTIVE":{
      const d=deptByKey(s,payload.deptKey);
      if(d)d.directive=payload.directive;
      break;
    }

    case "NEW_PROJECT":
      if(s.projects.length>=maxProjects(s)){toast("業務部人力不足，無法同時負責更多案件。");return;}
      const np=makeProject(s);
      s.projects.push(np);
      s.log("業務",`業務部開始洽談新案件：「${np.customer}」。`);
      renderAll();
      break;

    case "UNLOCK_DEPT":{
      const d=deptByKey(s,payload.deptKey);
      if(!d||d.unlocked)return;
      if(!d.unlockCheck(s)){toast("尚未達成解鎖條件："+d.unlockHint);return;}
      if(s.company.cash<d.cost){toast("現金不足。");return;}
      s.company.cash-=d.cost;d.unlocked=true;
      AUDIO.sfx("fanfare");
      const defDirective=CONFIG.DIRECTIVES[d.key]?.[0].id;
      if(defDirective)d.directive=defDirective;
      s.log("組織",`開設了「${d.name}」，花費 ${d.cost} 萬。`);
      renderAll();
      break;
    }

    case "INVEST_ASK":{
      const d=deptByKey(s,payload.deptKey);
      if(!d||!d.unlocked)return;
      const cost=investCost(d);
      if(cost===null){toast("已達最高設備等級。");return;}
      const FX={
        sales:"議價力 +2%（合約單價微增）",
        rd:"製程成功率 +4%（案件開發更快通過）",
        prod:"設備產能 +60 件/月、良率 +3%",
        qa:"退貨率 -0.2%",
        proc:"COGS 議價空間增加",
        fin:"回報噪音降低（數字更可信）",
        global:"海外訂單單價提升"
      };
      openModal(`<div class="m-meta">設備投資 · ${d.name}</div>
        <div class="m-title">升級至 Lv.${d.investLevel+1}（${cost} 萬）</div>
        <div class="m-desc">本級效果：<b>${FX[d.key]||"部門效率提升"}</b><br>投資金額計入公司資本額，可提高授信額度。</div>
        <button class="m-choice" onclick="closeModal();dispatch('INVEST_DEPT',{deptKey:'${d.key}'})">確認升級</button>
        <button class="m-choice" onclick="dispatch('CLOSE_MODAL')">再想想</button>`);
      break;
    }

    case "REPLACE_EQUIP":{
      const prod=deptByKey(s,"prod");
      const cost=replaceEquipCost(s);
      if(s.company.cash<cost){toast("現金不足。");return;}
      openModal(`<div class="m-meta">設備汰換 · 產線部</div>
        <div class="m-title">全面汰換老舊設備（${cost} 萬）</div>
        <div class="m-desc">目前設備老化 <b>${Math.round(s.company.equipmentAging*100)}%</b>，良率正被拖累。汰換後老化歸零，設備等級不變，費用計入資本額。</div>
        <button class="m-choice" onclick="closeModal();dispatch('REPLACE_EQUIP_GO')">確認汰換</button>
        <button class="m-choice" onclick="dispatch('CLOSE_MODAL')">再想想</button>`);
      break;
    }
    case "REPLACE_EQUIP_GO":{
      const cost=replaceEquipCost(s);
      if(s.company.cash<cost){toast("現金不足。");return;}
      s.company.cash-=cost;s.company.capital+=cost;
      s.company.equipmentAging=0.05;
      AUDIO.sfx("fanfare");
      s.log("投資",`產線設備全面汰換，花費 ${cost} 萬，設備老化重置。`);
      renderAll();
      break;
    }

    case "INVEST_DEPT":{
      const d=deptByKey(s,payload.deptKey);
      if(!d||!d.unlocked)return;
      const cost=investCost(d);
      if(cost===null){toast("已達最高設備等級。");return;}
      if(s.company.cash<cost){toast("現金不足。");return;}
      s.company.cash-=cost;s.company.capital+=cost;d.investLevel++;
      s.log("投資",`「${d.name}」設備升至 Lv.${d.investLevel}，花費 ${cost} 萬。`);
      renderAll();
      break;
    }

    case "EXPAND_DEPT":{
      const d=deptByKey(s,payload.deptKey);
      if(!d||!d.unlocked)return;
      const cost=expandCost(d);
      if(s.company.cash<cost){toast("現金不足。");return;}
      s.company.cash-=cost;s.company.capital+=cost;d.slots++;
      s.log("組織",`「${d.name}」員額擴編至 ${d.slots} 人，花費 ${cost} 萬。`);
      renderAll();
      break;
    }

    case "RECRUIT_OPEN":{
      const d=deptByKey(s,payload.deptKey);
      if(!d||!d.unlocked)return;
      if(d.employees.length>=d.slots){toast("此部門員額已滿。");return;}
      const posMap={sales:"業務",rd:"工程師",prod:"產線人員",qa:"品保",proc:"採購",fin:"財務",global:"海外業務"};
      const pos=posMap[d.key]||"工程師";
      s.ui.monthCands=s.ui.monthCands||{};
      if(!s.ui.monthCands[d.key]){
        const cands=[makeEmployee(pos,d,s),makeEmployee(pos,d,s)];
        if(Math.random()<0.4)cands.push(makeEmployee(pos,d,s));
        s.ui.monthCands[d.key]=cands.map(c=>({...c,interviewed:false,interviewHint:null}));
      }
      s.ui.tempCandidates=s.ui.monthCands[d.key];
      showRecruitModal(d,s.ui.tempCandidates);
      break;
    }

    case "BULK_RECRUIT_OPEN":{
      const d=deptByKey(s,payload.deptKey);
      if(!d||!d.unlocked)return;
      const free=d.slots-d.employees.length;
      if(free<=0){toast("此部門員額已滿。");return;}
      const posMap={sales:"業務",rd:"工程師",prod:"產線人員",qa:"品保",proc:"採購",fin:"財務",global:"海外業務"};
      const pos=posMap[d.key]||"工程師";
      const n=Math.min(free,8);
      s.ui.monthBulk=s.ui.monthBulk||{};
      if(!s.ui.monthBulk[d.key]||s.ui.monthBulk[d.key].length!==n)
        s.ui.monthBulk[d.key]=Array.from({length:n},()=>makeEmployee(pos,d,s));
      s.ui.bulkCands=s.ui.monthBulk[d.key];
      const total=s.ui.bulkCands.reduce((a,c2)=>a+c2.salary,0);
      const rows=s.ui.bulkCands.map(c2=>
        `<tr><td>${c2.name}</td><td><span class="cand-rt r-${c2.rating}">${c2.rating}</span></td><td>${c2.position}</td><td style="text-align:right">${c2.salary} 萬/月</td></tr>`).join("");
      openModal(`<div class="m-meta">一鍵招募 · ${d.name}</div>
        <div class="m-title">本次招募人員清單</div>
        <table class="ctbl" style="width:100%">${rows}</table>
        <div class="m-desc" style="margin-top:8px">合計 <b>${n} 人</b>，每月人事支出增加約 <b>${Math.round(total)} 萬</b></div>
        <button class="m-choice" onclick="dispatch('BULK_RECRUIT_CONFIRM',{deptKey:'${d.key}'})">確認全部錄取</button>
        <button class="m-choice" onclick="dispatch('CLOSE_MODAL')">取消</button>`);
      break;
    }

    case "BULK_RECRUIT_CONFIRM":{
      const d=deptByKey(s,payload.deptKey);
      if(!d||!s.ui.bulkCands)return;
      const hired=s.ui.bulkCands.splice(0);
      if(s.ui.monthBulk)delete s.ui.monthBulk[d.key];
      hired.forEach(c2=>{delete c2.interviewed;delete c2.interviewHint;d.employees.push(c2);});
      AUDIO.sfx("hire");
      s.log("招募",`${d.name}一次招募 ${hired.length} 人到職。`);
      closeModal();renderAll();
      break;
    }

    case "RECRUIT_INTERVIEW":{
      if(s.company.bossActions.inspect&&s.company.bossActions.borrow&&s.company.bossActions.repay&&s.company.bossActions.negotiate){
        toast("本月老闆行動均已用完，面試需要老闆親自參與。");return;
      }
      const cand=s.ui.tempCandidates.find(c=>c.id===payload.candidateId);
      if(!cand)return;
      const dLabels={technical:"技術力",sales:"業務力",management:"管理力",integrity:"誠信值"};
      const primaryMap={sales:"sales",rd:"technical",prod:"technical",qa:"technical",proc:"management",fin:"management",global:"sales"};
      const dept2=s.departments.find(dd=>s.ui.tempCandidates===s.ui.monthCands?.[dd.key])||_empDept(cand);
      const pk=primaryMap[dept2?.key]||"technical";
      const band=v=>{const lo=Math.max(0,Math.round((v-rnd(5,12))/5)*5),hi=Math.min(100,Math.round((v+rnd(5,12))/5)*5);return `約${lo}~${hi}`;};
      cand.interviewHint=`面談評估 — ${dLabels[pk]}：${band(cand.trueAbility[pk])}｜誠信：${band(cand.trueAbility.integrity)}｜管理：${band(cand.trueAbility.management)}`;
      cand.interviewed=true;
      // Use up one action slot for the interview
      if(!s.company.bossActions.inspect)s.company.bossActions.inspect=true;
      else if(!s.company.bossActions.borrow)s.company.bossActions.borrow=true;
      renderAll();
      const d2=payload.deptRef;
      showRecruitModal(d2,s.ui.tempCandidates);
      toast("面試完成！");
      break;
    }

    case "RECRUIT_HIRE":{
      const cand=s.ui.tempCandidates.find(c=>c.id===payload.candidateId);
      const d=deptByKey(s,payload.deptKey);
      if(!cand||!d)return;
      d.employees.push(cand);
      if(s.ui.monthCands&&s.ui.monthCands[d.key])s.ui.monthCands[d.key]=s.ui.monthCands[d.key].filter(x=>x.id!==cand.id);
      AUDIO.sfx("hire");
      s.log("招募",`「${cand.name}」加入了${d.name}（${cand.school} ・ 評級${cand.rating}）。`);
      closeModal();
      renderAll();
      break;
    }

    case "ACCEPT_CONTRACT":{
      const p=s.projects.find(pr=>pr.id===payload.projectId);
      const offer=payload.offer||(s.ui.tempOffers||[])[payload.offerIdx];
      if(!p||!offer)return;
      payload.offer=offer;
      p.contract={...offer,monthsLeft:offer.months,totalMonths:offer.months};
      s.log("合約",`「${p.customer}」案件承接「${payload.offer.customer}」合約：售價${payload.offer.price}萬／${payload.offer.volume}件，為期${payload.offer.months}個月。`);
      closeModal();
      processUIQueue();
      break;
    }

    case "SKIP_CONTRACT":{
      s.log("合約",`「${s.projects.find(p=>p.id===payload.projectId)?.customer||"未知"}」案件本月暫不接單。`);
      closeModal();
      processUIQueue();
      break;
    }

    case "RESOLVE_EVENT":{
      const{ev,ctx,optIdx}=payload;
      ev.options[optIdx].eff(s,ctx);
      s.log(ev.bucket,`「${ev.name}」→「${ev.options[optIdx].label}」`);
      closeModal();
      renderAll();
      checkSolvency(STATE);
      saveGame(STATE);
      if(!isModalOpen())processUIQueue();
      break;
    }

    case "SHOW_TUTORIAL": showTutorial(); break;
    case "TOGGLE_SIDEBAR": toggleSidebar(); break;
    case "SET_SIDE_TAB": s.ui.sideTab=payload.tab; renderSide(); break;
    case "CLOSE_MODAL":
      if(STATE&&STATE.company&&STATE.company.bankrupt){return;}
      if(STATE&&STATE._pendingEventShown){toast("請先選擇一個處理方式。");return;}
      closeModal(); processUIQueue(); break;
  }
}

/* ============================================================
   UI — employee SVG figure
============================================================ */
const SPRITE_BASE="sprites/office/";
function empSprite(e){
  if(e.sprite)return e.sprite;
  const g=e.gender||"m";
  if(e.position==="總經理")return "gm_"+g;
  if(e.position==="處長"||e.position==="經理")return "manager_"+g+"_"+(((e.figv||1)%2)+1);
  return "staff_"+g+"_"+(e.figv||1);
}
function empSVG(e,w=24,h=34){
  const rc=CONFIG.RATING_COLORS[e.rating]||"#5a6b78";
  const mc=moodColor(e.loyalty);
  const ac=moodAnim(e.loyalty);
  return `<span class="fig ${ac}" style="width:${w}px;height:${h}px">`+
    `<img src="${SPRITE_BASE+empSprite(e)}.png" alt="" draggable="false">`+
    `<i class="mood" style="background:${mc}"></i>`+
    `<i class="rband" style="background:${rc}"></i>`+
  `</span>`;
}

/* ============================================================
   UI — renderAll
============================================================ */
function renderAll(){
  const s=STATE;
  if(!s)return;
  renderTopbar(s);
  renderBossRow(s);
  renderRooms(s);
  renderSide(s);
  renderBottomBar(s);
}

function renderTopbar(s){
  const c=s.company;
  document.getElementById("co-name").textContent=c.name;
  document.getElementById("co-month").textContent=`第 ${c.month} 月 ・ 企業指數 ${calcEnterpriseIndex(s)} ・ 設備老化 ${(c.equipmentAging*100).toFixed(0)}%`;
}

function renderBossRow(s){
  document.getElementById("boss-svg").innerHTML=empSVG({rating:"彩",loyalty:85,sprite:"extra_m_suit_blond"},32,44);
  document.getElementById("boss-name").textContent="老闆（你）";
  document.getElementById("boss-sub").textContent=`第 ${s.company.month} 月 ・ AP：${Object.values(s.company.bossActions).filter(v=>!v).length}/${Object.keys(s.company.bossActions).length} 個行動可用`;
  const gmNode=document.getElementById("gm-node");
  if(s.hasGM&&s.gm){
    gmNode.style.display="flex";
    document.getElementById("gm-svg").innerHTML=empSVG(s.gm);
    document.getElementById("gm-name").textContent=`${s.gm.name}（總經理）`;
    document.getElementById("gm-sub").textContent=`${moodEmoji(s.gm.loyalty)} 管理力：${Math.round(s.gm.trueAbility.management)}（點擊查看）`;
    document.getElementById("gm-node").onclick=()=>showEmployeeModal(s.gm);
    document.getElementById("gm-node").style.cursor="pointer";
  } else {
    gmNode.style.display="none";
  }
  const hc=s.departments.reduce((a,d)=>a+d.employees.length,0);
  const gmBtn=document.getElementById("btn-gm-appoint");
  gmBtn.style.display=(!s.hasGM&&hc>=10)?"inline-block":"none";
  gmBtn.onclick=showGMAppointChoice;
}

function showGMAppointChoice(){
  openModal(`<div class="m-meta">組織</div>
    <div class="m-title">任命總經理</div>
    <div class="m-desc">從內部提拔（知根知底，能力已知）或對外空降（可能更強，但真實能力是個謎）。</div>
    <button class="m-choice" onclick="closeModal();promoteInternalGM(STATE)">從現有員工中提拔</button>
    <button class="m-choice" onclick="closeModal();recruitExternalGM(STATE)">對外招募空降總經理</button>
    <button class="m-choice" onclick="dispatch('CLOSE_MODAL')">先不任命</button>`);
}

function renderRooms(s){
  const grid=document.getElementById("rooms-grid");
  grid.innerHTML="";
  s.departments.forEach(dept=>{
    const def=CONFIG.DEPT_DEFS.find(d=>d.key===dept.key);
    const div=document.createElement("div");
    div.className="room";
    div.dataset.dept=dept.key;
    if(!dept.unlocked){
      const condMet=dept.unlockCheck(s);
      div.innerHTML=`<div class="locked-room">
        <div class="lroom-name">${dept.name}</div>
        <div class="lroom-hint">${condMet?"花 "+dept.cost+" 萬即可開設":dept.unlockHint}</div>
        <button class="unlock-btn"${condMet?"":" disabled"} onclick="dispatch('UNLOCK_DEPT',{deptKey:'${dept.key}'})">${condMet?"開設 · "+dept.cost+"萬":"尚未解鎖"}</button>
      </div>`;
    } else {
      const dirLabel=CONFIG.DIRECTIVES[dept.key]?.find(d=>d.id===dept.directive)?.label||"";
      const kpi1=def.kpis?.[0];const kpi2=def.kpis?.[1];
      const v1=kpi1?Math.round(kpi1.fn(dept,s)):0;
      const v2=kpi2?Math.round(kpi2.fn(dept,s)):0;
      const kpiColor1=v1>60?"var(--green)":v1>35?"var(--yellow)":"var(--red)";
      const kpiColor2=v2>60?"var(--green)":v2>35?"var(--yellow)":"var(--red)";
      const invCost=investCost(dept);
      const expCost=expandCost(dept);
      const{floor:floorHtml,headBanner}=deptFloor(dept,s);
      div.innerHTML=`
        <div class="room-hdr">
          <div class="room-name">${dept.name} Lv.${dept.investLevel}</div>
          <div class="d-badge">${dirLabel}</div>
        </div>
        ${kpi1?`<div class="kpi-row"><span class="kpi-lbl">${kpi1.label}</span><div class="kpi-track"><div class="kpi-fill" style="width:${v1}%;background:${kpiColor1}"></div></div><span class="kpi-v">${v1}</span></div>`:""}
        ${kpi2?`<div class="kpi-row"><span class="kpi-lbl">${kpi2.label}</span><div class="kpi-track"><div class="kpi-fill" style="width:${v2}%;background:${kpiColor2}"></div></div><span class="kpi-v">${v2}</span></div>`:""}
        ${headBanner}
        <div class="room-floor">${floorHtml}</div>
        <div class="invest-row">
          <button class="invest-btn"${invCost===null?" disabled":""} onclick="dispatch('INVEST_ASK',{deptKey:'${dept.key}'})">${invCost===null?`設備已頂`:`設備升級 ·${invCost}萬`}</button>
          <button class="expand-btn" onclick="dispatch('EXPAND_DEPT',{deptKey:'${dept.key}'})">擴編+1 ·${expCost}萬</button>
          ${dept.key==="prod"&&STATE.company.equipmentAging>0.3?`<button class="expand-btn" style="border-color:var(--orange);color:var(--orange)" onclick="dispatch('REPLACE_EQUIP')">汰換設備（老化${Math.round(STATE.company.equipmentAging*100)}%）·${replaceEquipCost(STATE)}萬</button>`:""}
        </div>`;
    }
    grid.appendChild(div);
  });
}

function renderSide(s){
  s=s||STATE;
  const sp=document.getElementById("side-panel");
  if(!s.ui.sideOpen){sp.classList.add("collapsed");return;}
  sp.classList.remove("collapsed");
  document.querySelectorAll(".s-tab").forEach(t=>{
    t.classList.toggle("active",t.dataset.tab===s.ui.sideTab);
  });
  const sc=document.getElementById("side-content");
  const c=s.company;
  const showTrue=c.inspectMode==="full";
  const showPartial=c.inspectMode==="partial";
  const yieldDisplay=showTrue?c.trueYieldRate:showPartial?(c.trueYieldRate+c.reportedYieldRate)/2:c.reportedYieldRate;
  const yieldClass=showTrue?"true-val":showPartial?"rpt-val":"rpt-val";
  const f=s.lastFin||{revenue:0,cogs:0,opex:0,interest:0,net:0,capacity:0,demand:0};
  const tab=s.ui.sideTab;
  if(tab==="finance"){
    let contractHtml="";
    s.projects.filter(p=>p.contract).forEach(p=>{
      contractHtml+=`<div class="s-stat"><span class="s-lbl">${p.customer}·合約</span><span class="s-val">${p.contract.price.toFixed(0)}萬/${p.contract.volume}件·剩${p.contract.monthsLeft}月</span></div>`;
    });
    sc.innerHTML=`
      <div class="s-stat"><span class="s-lbl">現金</span><span class="s-val ${c.cash<0?"neg":""}">${c.cash.toFixed(1)}萬</span></div>
      <div class="s-stat"><span class="s-lbl">負債 / 額度</span><span class="s-val">${c.debt.toFixed(0)} / ${creditLimit(c)}萬</span></div>
      <div class="s-stat"><span class="s-lbl">負債比</span><span class="s-val ${c.debtRatio()>0.6?"neg":""}">${(c.debtRatio()*100).toFixed(1)}%</span></div>
      <div class="s-stat"><span class="s-lbl">股東權益</span><span class="s-val">${c.equity.toFixed(1)}萬</span></div>
      <div class="s-stat"><span class="s-lbl">${showTrue?"🔍真實良率":showPartial?"🔍良率(折中)≈":"回報良率≈"}</span><span class="s-val ${yieldClass}">${yieldDisplay.toFixed(1)}%${showTrue?`（回報 ${c.reportedYieldRate.toFixed(1)}%）`:""}</span></div>
      <div class="s-stat"><span class="s-lbl">總產能/需求</span><span class="s-val">${f.capacity}/${f.demand}件</span></div>
      <div class="s-stat"><span class="s-lbl">本月營收</span><span class="s-val">${f.revenue.toFixed(1)}</span></div>
      <div class="s-stat"><span class="s-lbl">本月COGS</span><span class="s-val">${f.cogs.toFixed(1)}</span></div>
      <div class="s-stat"><span class="s-lbl">薪資費用</span><span class="s-val">${f.opex.toFixed(1)}</span></div>
      <div class="s-stat"><span class="s-lbl">本月淨利</span><span class="s-val ${f.net>=0?"pos":"neg"}">${f.net.toFixed(1)}</span></div>
      <div class="s-stat"><span class="s-lbl">客戶信任</span><span class="s-val">${c.customerTrust.toFixed(0)}</span></div>
      ${contractHtml}`;
  } else if(tab==="risk"){
    const note=showTrue?"本月已視察 — 顯示真實風險值":showPartial?"本月已視察，但經總經理篩選 — 顯示折中值":"顯示回報值（可能失真） — 視察可取得更真實的數據";
    const rc=v=>v<25?"var(--green)":v<50?"var(--yellow)":v<75?"var(--orange)":"var(--red)";
    const rt=v=>v<25?"穩定":v<50?"留意":v<75?"偏高":"危險";
    let rHtml=`<div style="font-size:10px;color:var(--muted);margin-bottom:8px;">${note}</div>`;
    Object.keys(c.trueRisk).forEach(k=>{
      const tv=c.trueRisk[k],rv=c.reportedRisk[k];
      const v=showTrue?tv:showPartial?(tv+rv)/2:rv;
      rHtml+=`<div class="risk-wrap"><div class="risk-hdr"><span>${k}</span><span style="color:${rc(v)}">${rt(v)}</span></div><div class="risk-track"><div class="risk-fill" style="width:${v}%;background:${rc(v)}"></div></div></div>`;
    });
    sc.innerHTML=rHtml;
  } else if(tab==="projects"){
    const lastIdx=s.industry.stages.length-1;
    let pHtml=s.projects.map(p=>{
      const stages=s.industry.stages.map((st,i)=>`<span class="pj-pill${i<p.stageIndex?" done":i===p.stageIndex?" active":""}">${st}</span>`).join("");
      let info,cls;
      if(p.stageIndex<lastIdx){info=`製程中，本階段剩餘 ${p.stageMonthsLeft} 個月`;cls="";}
      else if(p.contract){info=`合約：${p.contract.customer} · 剩 ${p.contract.monthsLeft} 個月`;cls="ok";}
      else{info="量產中，尚無合約";cls="warn";}
      return `<div class="pj-card"><div class="pj-nm">「${p.customer}」</div><div class="pj-stages">${stages}</div><div class="pj-info ${cls}">${info}</div></div>`;
    }).join("");
    sc.innerHTML=pHtml||`<div style="font-size:11px;color:var(--muted)">暫無案件</div>`;
  } else {
    sc.innerHTML=s.eventLog.slice(0,40).map(item=>`<div class="log-item"><span class="log-m">M${item.month}</span>[${item.tag}] ${item.msg}</div>`).join("");
  }
}

function renderBottomBar(s){
  // Boss actions
  const ba=s.company.bossActions;
  const actions=[
    {id:"inspect",label:"視察部門",action:"INSPECT"},
    {id:"borrow",label:"借款",action:"BORROW"},
    {id:"repay",label:"還款",action:"REPAY",disabled:s.company.debt<=0},
    {id:"negotiate",label:"合約議價",action:"NEGOTIATE",disabled:!s.projects.some(p=>p.contract)}
  ];
  document.getElementById("boss-actions").innerHTML=actions.map(a=>{
    const used=ba[a.id];const dis=used||a.disabled;
    return`<button class="abtn"${dis?" disabled":""} onclick="dispatch('${a.action}')">${a.label}${used?'<span class="used-tag">已使用</span>':""}</button>`;
  }).join("");

  // Directives
  const activeUnlocked=s.departments.filter(d=>d.unlocked&&CONFIG.DIRECTIVES[d.key]);
  document.getElementById("dirs-row").innerHTML=activeUnlocked.map(d=>{
    const opts=CONFIG.DIRECTIVES[d.key];
    return`<div class="dir-item"><span class="dir-nm">${d.name.replace("部","")}</span>
      <select class="dir-sel" onchange="dispatch('SET_DIRECTIVE',{deptKey:'${d.key}',directive:this.value})">

function showContractModal(project){
  const base=STATE.industry.key==="PCM"?40:100;
  const sales=deptByKey(STATE,"sales");
  const expandBoost=sales?.directive==="expand"?1.12:1;
  const offers=[
    {customer:"老客戶 - 穩定單",price:Math.round(base*rnd(0.9,1.0)),volume:Math.round(rnd(15,25)*expandBoost),months:Math.round(rnd(3,5))},
    {customer:"新客戶 - 高價挑戰單",price:Math.round(base*rnd(1.15,1.35)),volume:Math.round(rnd(8,15)*expandBoost),months:Math.round(rnd(2,3))}
  ];
  if(STATE.company.customerTrust>60)
    offers.push({customer:"大客戶 - 量大單",price:Math.round(base*rnd(0.8,0.92)),volume:Math.round(rnd(28,40)*expandBoost),months:Math.round(rnd(4,6))});
  const global_=deptByKey(STATE,"global");
  if(global_?.unlocked&&global_.employees.length)
    offers.push({customer:"海外客戶 - 高單價大單",price:Math.round(base*rnd(1.2,1.5)*(global_.directive==="expand"?1.15:1)),volume:Math.round(rnd(20,32)),months:Math.round(rnd(3,5))});
  STATE.ui.tempOffers=offers;

  const rd_=deptByKey(STATE,"rd");
  const rdPower=rd_?rd_.employees.reduce((a,e)=>a+e.trueAbility.technical,0)/50:0;
  const ci=STATE._capInfo||{laborCap:0,equipCap:60};
  const capNow=Math.min(ci.laborCap,ci.equipCap);
  const lastIdx_=STATE.industry.stages.length-1;
  const demandNow=STATE.projects.filter(p=>p.stageIndex===lastIdx_&&p.contract).reduce((a,p)=>a+p.contract.volume,0);
  const qaOk=(STATE._qaCover??1)>=0.99;

  const ctHtml=offers.map((o,i)=>{
    const rdReq=Math.ceil(o.volume/6);
    const rdShort=rdPower<rdReq;
    const capShort=demandNow+o.volume>capNow;
    const tags=[];
    tags.push(rdShort?`<span style="color:var(--red)">✖ 研發力 ${rdPower.toFixed(1)}/${rdReq}（不足，無法承接）</span>`
                     :`<span style="color:var(--green)">✔ 研發力 ${rdPower.toFixed(1)}/${rdReq}</span>`);
    if(capShort)tags.push(`<span style="color:var(--orange)">⚠ 產能不足（現有 ${capNow} 件，接單後需求 ${demandNow+o.volume} 件）— 可硬接，良率將受交期壓力影響</span>`);
    if(!qaOk)tags.push(`<span style="color:var(--orange)">⚠ 品保覆蓋不足 — 退貨與重工風險升高</span>`);
    return `
    <div class="ct-card">
      <div class="ct-top"><span>${o.customer}</span><span>${o.months} 個月</span></div>
      <div class="ct-row"><span>單價</span><span>${o.price} 萬</span></div>
      <div class="ct-row"><span>每月訂單量</span><span>${o.volume} 件</span></div>
      <div style="font-size:9.5px;line-height:1.7;margin:4px 0">${tags.join("<br>")}</div>
      ${rdShort?`<button class="ct-btn" disabled style="opacity:.4">研發能量不足</button>`
               :`<button class="ct-btn" onclick="dispatch('ACCEPT_CONTRACT',{projectId:'${project.id}',offerIdx:${i}})">承接此合約</button>`}
    </div>`;}).join("");
  openModal(`<div class="m-meta">合約洽談 · 「${project.customer}」案件</div>
    <div class="m-title">本案件有 ${offers.length} 張合約邀約</div>
    <div class="m-desc">訂單量與售價由客戶決定，你能做的是挑哪張單、要不要承接——產能不足會傷客戶信任。</div>

}

function _appointHead(deptKey,empId){
  var s=STATE;
  var d=s.departments.find(function(x){return x.key===deptKey;});
  if(!d)return;
  var e=d.employees.find(function(x){return x.id===empId;});
  if(!e)return;
  var def=CONFIG.DEPT_DEFS.find(function(x){return x.key===deptKey;});
  var title=def?def.headPos:"經理";
  if(d.headId&&d.headId!==empId){
    var old=d.employees.find(function(x){return x.id===d.headId;});
    if(old)_demoteHead(old,d);
  }
  d.headId=e.id;
  e._prePos=e._prePos||e.position;
  e._preSalary=e._preSalary||e.salary;
  e.position=title;
  e.salary=Math.max(e.salary,CONFIG.POSITION_SALARY[title]||9);
  e.loyalty=clamp(e.loyalty+10,0,100);

  closeModal();renderAll();
}

  var e=d.employees.find(function(x){return x.id===d.headId;});

}

function deptFloor(dept,s){
  var emps=dept.employees;
  var maxVisible=8;
  var overflow=emps.length>maxVisible?emps.length-maxVisible:0;
  var head_=deptHead(dept);
  var visible=emps;
  if(overflow){
    visible=emps.slice(0,maxVisible);
    if(head_&&!visible.some(function(e){return e.id===head_.id;})){visible=[head_].concat(visible.slice(0,maxVisible-1));}
  }
  var headEmp=deptHead(dept);
  var headOfficial=!!dept.headId;
  var sizeClass=emps.length<=4?"":emps.length<=7?"sm":"xs";
  var floor=visible.map(function(e){
    var isHead=headEmp&&e.id===headEmp.id&&(headOfficial||emps.length>1);
    var eid=_regEmp(e);
    var rl=STATE&&STATE._rumorLevel||0;
    var rumor=rl>0&&(parseInt(e.id.slice(2,6),36)%5<rl)?"<span class='rumor-bub'>💬</span>":"";
    return "<div class='emp-fig"+(sizeClass?" "+sizeClass:"")+(isHead?" is-head":"")+"' onclick='_clickEmp(\""+eid+"\")'>"+
      rumor+empSVG(e,24,34)+
      "<div class='emp-name'>"+e.name+"</div></div>";
  }).join("");
  if(overflow)floor+="<div class='emp-fig "+(sizeClass||"")+"' style='cursor:pointer' onclick='showDeptList(\""+dept.key+"\")'>"+
    "<div style='width:24px;height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px'>+"+overflow+"</div>"+
    "<div class='emp-name'>共"+emps.length+"人</div></div>";
  if(overflow){
    floor+="<div class='emp-overflow' onclick='showDeptList(\""+dept.key+"\")'>+"+overflow+"</div>";
  }
  if(dept.employees.length<dept.slots){
    floor+="<div class='plus-slot' onclick='dispatch(\"RECRUIT_OPEN\",{deptKey:\""+dept.key+"\"})'>+</div>";
  }
  var headBanner="";
  if(headEmp&&emps.length>0){
    var mgmt=Math.round(headEmp.trueAbility.management);
    var tech=Math.round(headEmp.trueAbility.technical);
    var hid=_regEmp(headEmp);
    var hTag=headOfficial?"★ ":"（代理）";
    var hbLabel="";
    if(headOfficial){
      var hb=headBonus(dept)*(STATE&&STATE._gmAmp||1);
      var pct=function(x){return (x>0?"+":"")+Math.round(x*1000)/10+"%";};
      var fx={prod:"良率"+pct(hb*0.1),sales:"售價"+pct(hb*0.1),rd:"成功率"+pct(hb*0.15),qa:"退貨"+pct(-hb*0.5),global:"售價"+pct(hb*0.1)}[dept.key]||("士氣"+pct(hb*0.02));
      hbLabel="<span style='color:"+(hb>=0?"var(--green)":"var(--red)")+"'>"+fx+"</span>";
    }
    headBanner="<div style='font-size:9px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-shrink:0;cursor:pointer' onclick='_clickEmp(\""+hid+"\")'>"+
      "<span>"+hTag+headEmp.name+" 管理"+mgmt+"</span><span>技術"+tech+"</span>"+hbLabel+"</div>";
  }
  return{floor:floor,headBanner:headBanner};
}
