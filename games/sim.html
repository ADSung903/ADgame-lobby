}
function renderSide(s){
  s=s||STATE;
  const sp=document.getElementById("side-panel");
  if(!s.ui.sideOpen){sp.classList.add("collapsed");return;}
  sp.classList.remove("collapsed");
  document.querySelectorAll(".s-tab").forEach(t=>{
    t.classList.toggle("active",t.dataset.tab===s.ui.sideTab);
  });
  const sc=document.getElementById("side-content");
  const c=s.company;
  const showTrue=c.inspectMode==="full";
  const showPartial=c.inspectMode==="partial";
  const yieldDisplay=showTrue?c.trueYieldRate:showPartial?(c.trueYieldRate+c.reportedYieldRate)/2:c.reportedYieldRate;
  const yieldClass=showTrue?"true-val":showPartial?"rpt-val":"rpt-val";
  const f=s.lastFin||{revenue:0,cogs:0,opex:0,interest:0,net:0,capacity:0,demand:0};
  const tab=s.ui.sideTab;
  if(tab==="finance"){
    let contractHtml="";
    s.projects.filter(p=>p.contract).forEach(p=>{
      contractHtml+=`<div class="s-stat"><span class="s-lbl">${p.customer}·合約</span><span class="s-val">${p.contract.price.toFixed(0)}萬/${p.contract.volume}件·剩${p.contract.monthsLeft}月</span></div>`;
    });
    sc.innerHTML=`
      <div class="s-stat"><span class="s-lbl">現金</span><span class="s-val ${c.cash<0?"neg":""}">${c.cash.toFixed(1)}萬</span></div>
      <div class="s-stat"><span class="s-lbl">負債 / 額度</span><span class="s-val">${c.debt.toFixed(0)} / ${creditLimit(c)}萬</span></div>
      <div class="s-stat"><span class="s-lbl">負債比</span><span class="s-val ${c.debtRatio()>0.6?"neg":""}">${(c.debtRatio()*100).toFixed(1)}%</span></div>
      <div class="s-stat"><span class="s-lbl">股東權益</span><span class="s-val">${c.equity.toFixed(1)}萬</span></div>
      <div class="s-stat"><span class="s-lbl">${showTrue?"🔍真實良率":showPartial?"🔍良率(折中)≈":"回報良率≈"}</span><span class="s-val ${yieldClass}">${yieldDisplay.toFixed(1)}%${showTrue?`（回報 ${c.reportedYieldRate.toFixed(1)}%）`:""}</span></div>
      <div class="s-stat"><span class="s-lbl">總產能/需求</span><span class="s-val">${f.capacity}/${f.demand}件</span></div>
      <div class="s-stat"><span class="s-lbl">本月營收</span><span class="s-val">${f.revenue.toFixed(1)}</span></div>
      <div class="s-stat"><span class="s-lbl">本月COGS</span><span class="s-val">${f.cogs.toFixed(1)}</span></div>
      <div class="s-stat"><span class="s-lbl">薪資費用</span><span class="s-val">${f.opex.toFixed(1)}</span></div>
      <div class="s-stat"><span class="s-lbl">本月淨利</span><span class="s-val ${f.net>=0?"pos":"neg"}">${f.net.toFixed(1)}</span></div>
      <div class="s-stat"><span class="s-lbl">客戶信任</span><span class="s-val">${c.customerTrust.toFixed(0)}</span></div>
      ${contractHtml}`;
  } else if(tab==="risk"){
    const note=showTrue?"本月已視察 — 顯示真實風險值":showPartial?"本月已視察，但經總經理篩選 — 顯示折中值":"顯示回報值（可能失真） — 視察可取得更真實的數據";
    const rc=v=>v<25?"var(--green)":v<50?"var(--yellow)":v<75?"var(--orange)":"var(--red)";
    const rt=v=>v<25?"穩定":v<50?"留意":v<75?"偏高":"危險";
    let rHtml=`<div style="font-size:10px;color:var(--muted);margin-bottom:8px;">${note}</div>`;
    Object.keys(c.trueRisk).forEach(k=>{
      const tv=c.trueRisk[k],rv=c.reportedRisk[k];
      const v=showTrue?tv:showPartial?(tv+rv)/2:rv;
      rHtml+=`<div class="risk-wrap"><div class="risk-hdr"><span>${k}</span><span style="color:${rc(v)}">${rt(v)}</span></div><div class="risk-track"><div class="risk-fill" style="width:${v}%;background:${rc(v)}"></div></div></div>`;
    });
    sc.innerHTML=rHtml;
  } else if(tab==="report"){
    const h=c.history||[];
    if(h.length<2){sc.innerHTML='<div style="font-size:11px;color:var(--muted);padding:10px">經營滿 2 個月後開始累積季報數據。</div>';return;}
    const last12=h.slice(-12);
    const W=210,H=80,P=4;
    const maxV=Math.max(...last12.map(x=>x.rev),1);
    const minN=Math.min(...last12.map(x=>x.net),0);
    const maxN=Math.max(...last12.map(x=>x.net),1);
    const px=i=>P+i*(W-2*P)/Math.max(1,last12.length-1);
    const pyR=v=>H-P-(v/maxV)*(H-2*P);
    const pyN=v=>H-P-((v-minN)/Math.max(1,maxN-minN))*(H-2*P);
    const revPts=last12.map((x,i)=>px(i)+","+pyR(x.rev)).join(" ");
    const netPts=last12.map((x,i)=>px(i)+","+pyN(x.net)).join(" ");
    const zeroY=pyN(0);
    // 成本結構圓餅（本月）
    const f2=h[h.length-1];
    const parts=[["COGS",f2.cogs,"#e08f3c"],["薪資",f2.sal,"#5aa9e6"],["利息",f2.int_,"#d95d5d"],["淨利",Math.max(0,f2.net),"#57c785"]];
    const tot=parts.reduce((a,p2)=>a+Math.max(0,p2[1]),0)||1;
    let ang=-Math.PI/2,slices="";
    parts.forEach(p2=>{
      const v=Math.max(0,p2[1]);if(!v)return;
      const a2=ang+v/tot*2*Math.PI;
      const large=(a2-ang)>Math.PI?1:0;
      const cx=40,cy=40,r=34;
      slices+='<path d="M'+cx+','+cy+' L'+(cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1)+' A'+r+','+r+' 0 '+large+' 1 '+(cx+r*Math.cos(a2)).toFixed(1)+','+(cy+r*Math.sin(a2)).toFixed(1)+' Z" fill="'+p2[2]+'" opacity="0.85"/>';
      ang=a2;
    });
    const legend=parts.filter(p2=>p2[1]>0).map(p2=>'<span style="font-size:9px;margin-right:8px"><span style="display:inline-block;width:8px;height:8px;background:'+p2[2]+';border-radius:2px;margin-right:3px"></span>'+p2[0]+' '+Math.round(p2[1]/tot*100)+'%</span>').join("");
    // 部門 KPI vs 上季
    let kpiRows="";
    s.departments.forEach(d=>{
      if(!d.unlocked||!d.kpis)return;
      const cur=(c.kpiSnap&&c.kpiSnap.cur||{})[d.key]||d.kpis.map(k=>{try{return Math.round(k.fn(d,s));}catch(e){return 0;}});
      const prev=(c.kpiSnapPrev||{})[d.key];
      d.kpis.forEach((k,i)=>{
        const cv=cur[i],pv=prev?prev[i]:null;
        const dir=pv===null?"─":cv>pv?"<span style='color:var(--green)'>▲"+(cv-pv)+"</span>":cv<pv?"<span style='color:var(--red)'>▼"+(pv-cv)+"</span>":"─";
        kpiRows+='<div class="s-stat"><span class="s-lbl">'+d.name+'·'+k.label+'</span><span class="s-val">'+cv+' '+dir+'</span></div>';
      });
    });
    sc.innerHTML='<div style="font-size:10px;color:var(--muted);margin-bottom:4px">近12月 營收(金)/淨利(綠) 趨勢</div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;background:var(--surface2);border-radius:6px">'+
      '<line x1="'+P+'" y1="'+zeroY+'" x2="'+(W-P)+'" y2="'+zeroY+'" stroke="#333" stroke-dasharray="2,2"/>'+
      '<polyline points="'+revPts+'" fill="none" stroke="var(--gold)" stroke-width="1.5"/>'+
      '<polyline points="'+netPts+'" fill="none" stroke="var(--green)" stroke-width="1.5"/></svg>'+
      '<div style="font-size:10px;color:var(--muted);margin:8px 0 4px">本月成本結構</div>'+
      '<div style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 80 80" style="width:80px">'+slices+'</svg><div>'+legend+'</div></div>'+
      '<div style="font-size:10px;color:var(--muted);margin:10px 0 4px">部門 KPI（對比上季）</div>'+kpiRows;
  } else if(tab==="projects"){
    const lastIdx=s.industry.stages.length-1;
    let pHtml=s.projects.map(p=>{
      const stages=s.industry.stages.map((st,i)=>`<span class="pj-pill${i<p.stageIndex?" done":i===p.stageIndex?" active":""}">${st}</span>`).join("");
      let info,cls;
      if(p.stageIndex<lastIdx){info=`製程中，本階段剩餘 ${p.stageMonthsLeft} 個月`;cls="";}
      else if(p.contract){info=`合約：${p.contract.customer} · 剩 ${p.contract.monthsLeft} 個月`;cls="ok";}
      else{info="量產中，尚無合約";cls="warn";}
      return `<div class="pj-card"><div class="pj-nm">「${p.customer}」</div><div class="pj-stages">${stages}</div><div class="pj-info ${cls}">${info}</div></div>`;
    }).join("");
    sc.innerHTML=pHtml||`<div style="font-size:11px;color:var(--muted)">暫無案件</div>`;
  } else {
    sc.innerHTML=s.eventLog.slice(0,40).map(item=>`<div class="log-item"><span class="log-m">M${item.month}</span>[${item.tag}] ${item.msg}</div>`).join("");
  }
}

function showContractModal(project){
  const base=STATE.industry.key==="PCM"?40:100;
  const sales=deptByKey(STATE,"sales");
  const expandBoost=sales?.directive==="expand"?1.12:1;
  const idx=calcEnterpriseIndex(STATE);
  const tierUp=1+Math.min(0.4,Math.max(0,(idx-50))/125); /* 企業指數越高單價微升 */
  const offers=[
    {tier:"std",difficulty:1,customer:"老客戶 - 量產標準單",price:Math.round(base*rnd(0.9,1.0)*tierUp),volume:Math.round(rnd(15,25)*expandBoost),months:Math.round(rnd(3,5))},
    {tier:"npi",difficulty:2,customer:"新客戶 - NPI 新案單",price:Math.round(base*rnd(1.3,1.5)*tierUp),volume:Math.round(rnd(8,15)*expandBoost),months:Math.round(rnd(3,4)),npi:Math.round(rnd(2,3))}
  ];
  if(STATE.company.customerTrust>60)
    offers.push({tier:"std",difficulty:1,customer:"大客戶 - 量大單",price:Math.round(base*rnd(0.8,0.92)*tierUp),volume:Math.round(rnd(28,40)*expandBoost),months:Math.round(rnd(4,6))});
  if(idx>=80)
    offers.push({tier:"strat",difficulty:3,customer:"戰略客戶 - 長約大單",price:Math.round(base*rnd(1.1,1.25)*tierUp),volume:Math.round(rnd(45,60)),months:Math.round(rnd(8,12))});
  const global_=deptByKey(STATE,"global");
  if(global_?.unlocked&&global_.employees.length)
    offers.push({tier:"std",difficulty:2,customer:"海外客戶 - 高單價大單",price:Math.round(base*rnd(1.2,1.5)*tierUp*(global_.directive==="expand"?1.15:1)*(1+avgAbility(global_,"sales")/500)),volume:Math.round(rnd(20,32)*(1+Math.min(global_.employees.length,6)*0.05)),months:Math.round(rnd(3,5))});
  STATE.ui.tempOffers=offers;

  const rd_=deptByKey(STATE,"rd");
  const rdPower=rd_?rd_.employees.reduce((a,e)=>a+e.trueAbility.technical,0)/50:0;
  const ci=STATE._capInfo||{laborCap:0,equipCap:60};
  const capNow=Math.min(ci.laborCap,ci.equipCap);
  const lastIdx_=STATE.industry.stages.length-1;
  const demandNow=STATE.projects.filter(p=>p.stageIndex===lastIdx_&&p.contract).reduce((a,p)=>a+p.contract.volume,0);
  const qaOk=(STATE._qaCover??1)>=0.99;

  const ctHtml=offers.map((o,i)=>{
    const rdReq=Math.ceil(o.volume/6*(o.tier==="npi"?1.5:o.tier==="strat"?1.2:1));
    const rdShort=rdPower<rdReq;
    const capShort=demandNow+o.volume>capNow;
    const tags=[];
    tags.push(rdShort?`<span style="color:var(--red)">✖ 研發力 ${rdPower.toFixed(1)}/${rdReq}（不足，無法承接）</span>`
                     :`<span style="color:var(--green)">✔ 研發力 ${rdPower.toFixed(1)}/${rdReq}</span>`);
    if(capShort)tags.push(`<span style="color:var(--orange)">⚠ 產能不足（現有 ${capNow} 件，接單後需求 ${demandNow+o.volume} 件）— 可硬接，良率將受交期壓力影響</span>`);
    if(!qaOk)tags.push(`<span style="color:var(--orange)">⚠ 品保覆蓋不足 — 退貨與重工風險升高</span>`);
    if(o.tier==="npi")tags.push(`<span style="color:var(--purple,#a78bfa)">🧪 NPI：先進行 ${o.npi} 個月導入期（無收入），研發弱會延期賠款；成功後全程高單價</span>`);
    if(o.tier==="strat")tags.push(`<span style="color:var(--gold)">🤝 戰略長約：量大穩定，但產能缺口的信任懲罰加倍</span>`);

      <div class="ct-row"><span>每月訂單量</span><span>${o.volume} 件</span></div>

function showEventModal(evItem){

  STATE._lastEv=ev;STATE._lastCtx=ctx;

  let skillBtn="";
  STATE._skillOpt=null;
  if(ev.skillTag){
    const hit=findSkillHolder(STATE,ev.skillTag);

      STATE._skillOpt={hit,rate};
      skillBtn=`<button class="m-choice" style="border-color:var(--gold);color:var(--gold)" onclick="resolveEvent(-1)">✨ 讓「${hit.e.name}」出馬（技能【${hit.sk.n}】，成功率 ${rate}%）</button>`;

  openModal(`<div class="m-meta">${ev.bucket} · ${levelLabel}</div>

}

function _appointVP(empId){

function _leaderBtnHtml(emp){
  var d=_empDept(emp);

  d.leaderIds=d.leaderIds||[];
  if(d.headId===emp.id)return "";

function _toggleLeader(empId,on){
  var s=STATE;
  var d=s.departments.find(function(dd){return dd.employees.some(function(e){return e.id===empId;});});
  if(!d)return;
  var e=d.employees.find(function(x){return x.id===empId;});
  d.leaderIds=d.leaderIds||[];
  if(on){
    d.leaderIds.push(empId);
    e._prePos=e._prePos||e.position;
    e._preSalary=e._preSalary||e.salary;
    e.position="組長";
    e.salary=Math.max(e.salary,CONFIG.POSITION_SALARY["組長"]);

    AUDIO.sfx("fanfare");

  }else{
    d.leaderIds=d.leaderIds.filter(function(id){return id!==empId;});
    e.position=e._prePos||e.position;
    e.salary=e._preSalary||e.salary;
    delete e._prePos;delete e._preSalary;
    e.loyalty=clamp(e.loyalty-10,0,100);

/* 深造 */
function _trainBtnHtml(emp){
  if(emp.position==="總經理")return "";
  if(emp.training)return "<div class='sub' style='margin-top:8px;color:var(--gold)'>📚 進修中，第 "+emp.training.until+" 月歸建（現在第 "+STATE.company.month+" 月）</div>";
  var c1=esc$(STATE,25),c2=esc$(STATE,120);
  return "<button class='m-choice' style='margin-top:8px' onclick='_train(\""+emp.id+"\",\"local\")'>送訓－國內受訓（"+c1+" 萬，3個月，主能力+5~10）</button>"+
    "<button class='m-choice' style='margin-top:8px' onclick='_train(\""+emp.id+"\",\"abroad\")'>出國深造（"+c2+" 萬，6個月，+15~25＋可能習得技能，10%被挖走）</button>";
}
function _train(empId,kind){
  var s=STATE;
  var e=allEmps(s).find(function(x){return x.id===empId;});
  if(!e||e.training)return;
  var cost=kind==="local"?esc$(s,25):esc$(s,120);
  if(s.company.cash<cost){toast("現金不足。");return;}
  s.company.cash-=cost;
  e.training={type:kind,until:s.company.month+(kind==="local"?3:6)};
  s.log("人事","「"+e.name+"」"+(kind==="local"?"參加國內受訓":"啟程出國深造")+"，預計第 "+e.training.until+" 月歸建。");
  saveGame(s);closeModal();renderAll();
}
function processTraining(s){
  if(s.gm&&s.gm.training&&s.company.month>=s.gm.training.until){
    var g=s.gm;
    var keys=["technical","sales","management","integrity"];
    var main=keys.reduce(function(a,k){return g.trueAbility[k]>g.trueAbility[a]?k:a;},"management");
    var gain=g.training.type==="abroad"?Math.round(rnd(15,25)):Math.round(rnd(5,10));
    g.trueAbility[main]=clamp(g.trueAbility[main]+gain,0,100);
    s.log("人事","總經理「"+g.name+"」進修歸建，"+main+" 提升 "+gain+"。");
    delete g.training;
  }
  s.departments.forEach(function(d){
    d.employees.slice().forEach(function(e){
      if(!e.training)return;
      if(s.company.month>=e.training.until){
        var abroad=e.training.type==="abroad";
        if(abroad&&Math.random()<0.1){
          d.employees=d.employees.filter(function(x){return x.id!==e.id;});
          if(d.headId===e.id)d.headId=null;
          d.leaderIds=(d.leaderIds||[]).filter(function(id){return id!==e.id;});
          s.log("人事","「"+e.name+"」深造結束後被國外公司高薪挖走——錢是你出的，人是別人的。");
          return;
        }
        var keys=["technical","sales","management","integrity"];
        var main=keys.reduce(function(a,k){return e.trueAbility[k]>e.trueAbility[a]?k:a;},"technical");
        var gain=abroad?Math.round(rnd(15,25)):Math.round(rnd(5,10));
        e.trueAbility[main]=clamp(e.trueAbility[main]+gain,0,100);
        if(abroad&&Math.random()<0.5&&(e.skills||[]).length<2){
          var ns=SKILLS[Math.floor(Math.random()*SKILLS.length)];
          if(!e.skills.includes(ns.id)){e.skills.push(ns.id);s.log("人事","「"+e.name+"」深造歸國，習得技能【"+ns.n+"】！");}
        }
        s.log("人事","「"+e.name+"」進修歸建，"+main+" 提升 "+gain+"。");
        delete e.training;
      }
    });
  });
}
function severancePay(e){
  const tenure=Math.max(1,(STATE.company.month-(e.joinMonth||0))/12);
  return Math.round(e.salary*tenure*0.5*10)/10;
}
function _fireBtnHtml(emp){
  const d=_empDept(emp);
  if(!d)return "";
  return "<button class='m-choice' style='margin-top:8px;border-color:var(--red);color:var(--red)' onclick='_askFire(\""+emp.id+"\")'>資遣此員工（資遣費 "+severancePay(emp)+" 萬）</button>";
}
function _askFire(empId){
  const s=STATE;
  const d=s.departments.find(dd=>dd.employees.some(e=>e.id===empId));
  if(!d)return;
  const e=d.employees.find(x=>x.id===empId);
  const cost=severancePay(e);
  openModal(`<div class="m-meta">人事 · 資遣</div>
    <div class="m-title">資遣「${e.name}」？</div>
    <div class="m-desc">資遣費：<b>${cost} 萬</b>（月薪×年資×0.5）<br>影響：${d.name}全員忠誠 -5、勞檢風險 +3。頻繁資遣會累積勞資糾紛風險。</div>
    <button class="m-choice" style="border-color:var(--red);color:var(--red)" onclick="_doFire('${empId}')">確認資遣</button>
    <button class="m-choice" onclick="dispatch('CLOSE_MODAL')">取消</button>`);
}
function _doFire(empId){
  const s=STATE;
  const d=s.departments.find(dd=>dd.employees.some(e=>e.id===empId));
  if(!d)return;
  const e=d.employees.find(x=>x.id===empId);
  const cost=severancePay(e);
  if(s.company.cash<cost){toast("現金不足以支付資遣費。");return;}
  s.company.cash-=cost;
  if(d.headId===e.id)d.headId=null;
  d.employees=d.employees.filter(x=>x.id!==empId);
  d.employees.forEach(x=>x.loyalty=clamp(x.loyalty-5,0,100));
  s.company.trueRisk.勞檢=clamp(s.company.trueRisk.勞檢+3,0,100);
  AUDIO.sfx("leave");
  s.log("人事",`「${e.name}」遭公司資遣，支付資遣費 ${cost} 萬。`);
  saveGame(s);closeModal();renderAll();
}
function _empDept(emp){
  return STATE.departments.find(function(d){return d.employees.some(function(e){return e.id===emp.id;});});
}
function deptHeadTitle(d){return d.employees.length>=13?"處長":"經理";}
function _headBtnHtml(emp){
  var d=_empDept(emp);
  if(!d)return "";
  var title=deptHeadTitle(d);
  if(d.headId===emp.id)
    return "<button class='m-choice' style='margin-top:14px' onclick='_dismissHead(\""+d.key+"\")'>解除主管職務（"+title+"）</button>";
  return "<button class='m-choice' style='margin-top:14px' onclick='_appointHead(\""+d.key+"\",\""+emp.id+"\")'>任命為 "+d.name+title+"（月薪調整至 "+(CONFIG.POSITION_SALARY[title]||9)+" 萬）</button>";
}
function _appointHead(deptKey,empId){
  var s=STATE;
  var d=s.departments.find(function(x){return x.key===deptKey;});
  if(!d)return;
  var e=d.employees.find(function(x){return x.id===empId;});
  if(!e)return;
  var title=deptHeadTitle(d);
  if(d.headId&&d.headId!==empId){
    var old=d.employees.find(function(x){return x.id===d.headId;});
    if(old)_demoteHead(old,d);
  }
  d.headId=e.id;
  e._prePos=e._prePos||e.position;
  e._preSalary=e._preSalary||e.salary;
  e.position=title;
  e.salary=Math.max(e.salary,CONFIG.POSITION_SALARY[title]||9);
  e.loyalty=clamp(e.loyalty+10,0,100);
  AUDIO.sfx("fanfare");
  s.log("組織","「"+e.name+"」升任"+d.name+title+"，月薪 "+e.salary+" 萬。");
  closeModal();renderAll();
}
function _dismissHead(deptKey){
  var s=STATE;
  var d=s.departments.find(function(x){return x.key===deptKey;});
  if(!d||!d.headId)return;
  var e=d.employees.find(function(x){return x.id===d.headId;});
  d.headId=null;
  if(e)_demoteHead(e,d);
  closeModal();renderAll();
}
function _demoteHead(e,d){
  var s=STATE;
  e.position=e._prePos||e.position;
  e.salary=e._preSalary||e.salary;
  delete e._prePos;delete e._preSalary;
  e.loyalty=clamp(e.loyalty-15,0,100);
  AUDIO.sfx("leave");
  s.log("組織","「"+e.name+"」卸下"+d.name+"主管職務，士氣受挫。");
}

function deptFloor(dept,s){
  var emps=dept.employees;
  var maxVisible=8;
  var overflow=emps.length>maxVisible?emps.length-maxVisible:0;
  var head_=deptHead(dept);
  var visible=emps;
  if(overflow){
    visible=emps.slice(0,maxVisible);
    if(head_&&!visible.some(function(e){return e.id===head_.id;})){visible=[head_].concat(visible.slice(0,maxVisible-1));}
  }
  var headEmp=deptHead(dept);
  var headOfficial=!!dept.headId;
  var sizeClass=emps.length<=4?"":emps.length<=7?"sm":"xs";
  var floor=visible.map(function(e){
    var isHead=headEmp&&e.id===headEmp.id&&(headOfficial||emps.length>1);
    var eid=_regEmp(e);
    var rl=STATE&&STATE._rumorLevel||0;
    var rumor=rl>0&&(parseInt(e.id.slice(2,6),36)%5<rl)?"<span class='rumor-bub'>💬</span>":"";
    var tmap={"組長":"組","主任":"任","經理":"理","副處長":"副處","處長":"處","副總":"副總"};
    var ttag=tmap[e.position]?"<span class='pos-tag'>"+tmap[e.position]+"</span>":"";
    var away=e.training?"<span class='pos-tag' style='color:var(--gold);border-color:var(--gold-dim)'>訓</span>":"";
    return "<div class='emp-fig"+(sizeClass?" "+sizeClass:"")+(isHead?" is-head":"")+"' onclick='_clickEmp(\""+eid+"\")'>"+
      rumor+empSVG(e,24,34)+
      "<div class='emp-name'>"+ttag+away+e.name+"</div></div>";
  }).join("");
  if(overflow)floor+="<div class='emp-fig "+(sizeClass||"")+"' style='cursor:pointer' onclick='showDeptList(\""+dept.key+"\")'>"+
    "<div style='width:24px;height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px'>+"+overflow+"</div>"+
    "<div class='emp-name'>共"+emps.length+"人</div></div>";
  if(overflow){
    floor+="<div class='emp-overflow' onclick='showDeptList(\""+dept.key+"\")'>+"+overflow+"</div>";
  }
  if(dept.employees.length<dept.slots){
    floor+="<div class='plus-slot' onclick='dispatch(\"RECRUIT_OPEN\",{deptKey:\""+dept.key+"\"})'>+</div>";
  }
  var headBanner="";
  if(headEmp&&emps.length>0){
    var mgmt=Math.round(headEmp.trueAbility.management);
    var tech=Math.round(headEmp.trueAbility.technical);
    var hid=_regEmp(headEmp);
    var hTag=headOfficial?"★"+deptHeadTitle(dept)+" ":"（代理）";
    var hbLabel="";
    if(headOfficial){
      var hb=headBonus(dept)*(STATE&&STATE._gmAmp||1);
      var pct=function(x){return (x>0?"+":"")+Math.round(x*1000)/10+"%";};
      var fx={prod:"良率"+pct(hb*0.1),sales:"售價"+pct(hb*0.1),rd:"成功率"+pct(hb*0.15),qa:"退貨"+pct(-hb*0.5),global:"售價"+pct(hb*0.1)}[dept.key]||("士氣"+pct(hb*0.02));
      hbLabel="<span style='color:"+(hb>=0?"var(--green)":"var(--red)")+"'>"+fx+"</span>";
    }
    headBanner="<div style='font-size:9px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-shrink:0;cursor:pointer' onclick='_clickEmp(\""+hid+"\")'>"+
      "<span>"+hTag+headEmp.name+" 管理"+mgmt+"</span><span>技術"+tech+"</span>"+hbLabel+"</div>";
  }
  return{floor:floor,headBanner:headBanner};
}

function showDeptList(deptKey){
  var dept=STATE.departments.find(function(d){return d.key===deptKey;});
  if(!dept)return;
  // refresh lookup
  dept.employees.forEach(function(e){_regEmp(e);});
  var listHtml=dept.employees.map(function(e){
    return "<div class='emp-list-item' onclick='_clickEmp(\""+e.id+"\")'>"+
      "<div>"+empSVG(e,18,26)+"</div>"+
      "<div class='eli-info'>"+
        "<div class='nm'>"+e.name+" ["+e.rating+"]</div>"+
        "<div class='sub'>"+e.position+" ・ 月薪"+e.salary+"萬 ・ "+e.traits[0]+"</div>"+
      "</div>"+
      "<div class='eli-mood'>"+moodEmoji(e.loyalty)+"</div>"+
    "</div>";
  }).join("");
  openModal(
    "<div class='m-meta'>"+dept.name+" 全體員工</div>"+
    "<div class='m-title'>"+dept.employees.length+" 名員工</div>"+
    "<div>"+listHtml+"</div>"+
    "<button class='m-choice' style='margin-top:10px' onclick=\"closeModal()\">關閉</button>"
  );
}

function _snapState(s){
  return{
    cash:s.company.cash,trust:s.company.customerTrust,debt:s.company.debt,
    risk:{...s.company.trueRisk},
    emps:allEmps(s).map(e=>({id:e.id,name:e.name,loyalty:e.loyalty,salary:e.salary,dept:(_empDept(e)||{}).name||"總經理室"}))
  };
}
function _diffReport(b,s){
  const lines=[];
  const dc=s.company.cash-b.cash;
  if(Math.abs(dc)>=0.5)lines.push(`💰 現金 ${dc>0?"+":""}${Math.round(dc)} 萬`);
  const dd=s.company.debt-b.debt;
  if(Math.abs(dd)>=0.5)lines.push(`🏦 負債 ${dd>0?"+":""}${Math.round(dd)} 萬`);
  const dt=s.company.customerTrust-b.trust;
  if(Math.abs(dt)>=1)lines.push(`🤝 客戶信任 ${dt>0?"上升":"下降"}`);
  Object.keys(b.risk).forEach(k=>{
    const dr=s.company.trueRisk[k]-b.risk[k];
    if(dr>=1)lines.push(`⚠️ ${k}風險${dr>=10?"大幅":""}上升`);
    else if(dr<=-1)lines.push(`✅ ${k}風險下降`);
  });
  const now=allEmps(s);
  const nowIds=new Set(now.map(e=>e.id));
  b.emps.filter(e=>!nowIds.has(e.id)).forEach(e=>lines.push(`🚪 「${e.name}」離職（${e.dept}）`));
  const loyByDept={};
  now.forEach(e=>{
    const prev=b.emps.find(x=>x.id===e.id);
    if(!prev)return;
    const dl=e.loyalty-prev.loyalty;
    if(Math.abs(dl)<1)return;
    loyByDept[prev.dept]=loyByDept[prev.dept]||{n:0,sum:0};
    loyByDept[prev.dept].n++;loyByDept[prev.dept].sum+=dl;
  });
  Object.entries(loyByDept).forEach(([dn,v])=>{
    const avg=Math.round(v.sum/v.n);
    lines.push(`${avg>0?"😊":"😟"} ${dn} ${v.n} 名員工 忠誠度 ${avg>0?"+":""}${avg}`);
  });
  now.forEach(e=>{
    const prev=b.emps.find(x=>x.id===e.id);
    if(prev&&e.salary!==prev.salary)lines.push(`💵 「${e.name}」月薪 ${prev.salary}→${e.salary} 萬`);
  });
  return lines;
}
function resolveEvent(optIdx){
  const s=STATE;
  const item=s._pendingEventShown;
  if(!item)return;
  if(optIdx===-1&&s._skillOpt){
    const{hit,rate}=s._skillOpt;
    s._pendingEventShown=null;
    closeModal();AUDIO.crisisOff();
    const ok=Math.random()*100<rate;
    if(ok){
      s.log(item.ev.bucket,`「${hit.e.name}」憑【${hit.sk.n}】漂亮化解了「${item.ev.name}」！`);
      AUDIO.sfx("victory");
      openModal(`<div class="m-meta">危機化解</div>
        <div class="m-title">✨「${hit.e.name}」出手，事件圓滿解決</div>
        <div class="m-desc">技能【${hit.sk.n}】發揮作用，「${item.ev.name}」未造成任何損失。要如何表揚？</div>
        <button class="m-choice" onclick="_skillReward('${hit.e.id}','bonus')">發獎金表揚（${esc$(s,10)} 萬，本人忠誠+20、全部門+3）</button>
        <button class="m-choice" onclick="_skillReward('${hit.e.id}','praise')">口頭嘉獎（免費，忠誠+5）</button>`);
      saveGame(s);renderAll();
      return;
    }
    s.log(item.ev.bucket,`「${hit.e.name}」嘗試處理「${item.ev.name}」但力有未逮，事件照常發生。`);
    item.ev.options[item.ev.options.length-1].eff(s,item.ctx);
    hit.e.loyalty=clamp(hit.e.loyalty-5,0,100);
    saveGame(s);renderAll();processUIQueue();
    return;
  }
  s._pendingEventShown=null;
  closeModal();
  AUDIO.crisisOff();
  const before=_snapState(s);
  const hcBefore=allEmps(s).length+(s.hasGM?1:0);
  item.ev.options[optIdx].eff(s,item.ctx);
  const hcAfter=allEmps(s).length+(s.hasGM?1:0);
  if(hcAfter<hcBefore)AUDIO.sfx("leave");
  s.log(item.ev.bucket,`「${item.ev.name}」→「${item.ev.options[optIdx].label}」`);
  saveGame(s);
  renderAll();
  if(!isModalOpen()){
    const lines=_diffReport(before,s);
    if(lines.length){
      openModal(`<div class="m-meta">決策結果 · ${item.ev.name}</div>
        <div class="m-title">「${item.ev.options[optIdx].label}」</div>
        <div class="m-desc">${lines.join("<br>")}</div>
        <button class="m-choice" onclick="dispatch('CLOSE_MODAL')">確定</button>`);
      return;
    }
  }
  processUIQueue();
}

function processUIQueue(){
  if(isModalOpen())return;
  const s=STATE;
  if(s.ui.pendingEvents.length>0){
    const item=s.ui.pendingEvents.shift();
    s._pendingEventShown=item;
    showEventModal(item);
    return;
  }
  if(s.ui.pendingContracts.length>0){
    const pid=s.ui.pendingContracts.shift();
    const p=s.projects.find(pr=>pr.id===pid);
    if(p&&!p.contract){showContractModal(p);return;}
    processUIQueue();
  }
}

function toggleSidebar(){
  const s=STATE;
  s.ui.sideOpen=!s.ui.sideOpen;
  renderSide(s);
  const bd=document.getElementById("side-backdrop");
  if(bd)bd.classList.toggle("show",s.ui.sideOpen&&window.innerWidth<=760);
}

/* ============================================================
   UI — Setup screen
============================================================ */
function renderSetup(){
  const grid=document.getElementById("ind-grid");
  grid.innerHTML="";
  const sv=loadSaveRaw();
  if(sv){
    const card=document.createElement("div");
    card.className="ind-card";
    card.style.borderColor="var(--gold)";
    card.innerHTML=`<div class="ind-name" style="color:var(--gold)">▶ 繼續經營</div>
      <div class="ind-cap">${sv.company.name} · 第 ${sv.company.month} 月</div>
      <div class="ind-desc">現金 ${Math.round(sv.company.cash)} 萬 · 員工 ${sv.departments.reduce((a,d)=>a+(d.employees?d.employees.length:0),0)} 人</div>`;
    card.onclick=()=>dispatch("CONTINUE_GAME");
    grid.appendChild(card);
    const del=document.createElement("div");
    del.style.cssText="grid-column:1/-1;text-align:center;font-size:10px;color:var(--muted);cursor:pointer;text-decoration:underline;margin-bottom:4px";
    del.textContent="刪除存檔，重新開始";
    del.onclick=()=>{if(confirm("確定刪除存檔？此動作無法復原。")){clearSave();renderSetup();}};
    grid.appendChild(del);
  }
  Object.entries(CONFIG.INDUSTRIES).forEach(([key,ind])=>{
    const card=document.createElement("div");
    card.className="ind-card"+(ind.enabled?"":" disabled");
    card.innerHTML=`<div class="ind-name">${ind.label}</div>
      <div class="ind-cap">起始資本 ${ind.capital} 萬</div>
      <div class="ind-desc">${ind.desc}</div>
      ${ind.enabled?"":'<span class="badge-soon">設計中，尚未開放</span>'}`;
    if(ind.enabled)card.onclick=()=>dispatch("START_GAME",{industryKey:key});
    grid.appendChild(card);
  });
}

/* ============================================================
   償債 / 破產
============================================================ */
function checkSolvency(s){
  const c=s.company;
  if(c.bankrupt)return;
  if(c.cash>=0){c.graceMonths=0;return;}
  c.graceMonths++;
  AUDIO.sfx("alarm");
  if(c.graceMonths>=4){doBankrupt(s);return;}
  const lim=creditLimit(c);
  const avail=Math.max(0,lim-Math.round(c.debt));
  const left=4-c.graceMonths;
  openModal(`<div class="m-meta">財務危機</div>
    <div class="m-title">⚠️ 現金為負（${c.cash.toFixed(1)} 萬）</div>
    <div class="m-desc">公司帳上現金不足，已連續 ${c.graceMonths} 個月。若再過 <b>${left} 個月</b>現金仍為負數，公司將宣告破產。<br><br>剩餘授信額度：<b>${avail} 萬</b>${avail<=0?"（額度已用盡——只能靠營運自救）":""}</div>
    ${avail>0?`<button class="m-choice" onclick="closeModal();dispatch('BORROW',{emergency:true})">緊急借款（不受每月一次限制）</button>`:""}
    <button class="m-choice" onclick="dispatch('CLOSE_MODAL')">先硬撐，靠營運翻身</button>`);
}
function doBankrupt(s){
  const c=s.company;
  c.bankrupt=true;
  clearSave();
  AUDIO.sfx("loss");
  AUDIO.bgm("bgm_crisis");
  s.log("結局","公司資金斷鏈，宣告破產。");
  openModal(`<div class="m-meta">遊戲結束</div>
    <div class="m-title">💸 公司破產</div>
    <div class="m-desc">「${c.name}」資金斷鏈、授信用盡，法院裁定破產。你失去了一切，淪落街頭。<br><br>
    <b>第 1 代公司經營紀錄</b><br>
    存活：${c.month} 個月<br>
    高光時刻：第 ${c.stats.bestMonth} 月，單月營收 ${c.stats.maxRevenue.toFixed(0)} 萬<br>
    最高單月獲利：${c.stats.maxNet.toFixed(0)} 萬<br>
    完成合約：${c.completedContracts} 件<br>
    最終負債：${Math.round(c.debt)} 萬</div>
    <button class="m-choice" onclick="location.reload()">東山再起（重新開始）</button>`);
}

/* ============================================================
   Toast
============================================================ */
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}
