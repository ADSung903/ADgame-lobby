<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>深海釣魚 Visual V1</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#001225;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#fff}.game{position:relative;margin:auto;width:min(100vw,480px);height:100dvh;overflow:hidden;background:#034c7d url('./assets/fishing/scene-v1.svg') center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(0,8,28,.06) 70%,rgba(0,3,18,.34));pointer-events:none}.hud{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between}.left{display:flex;gap:8px;align-items:flex-start}.pill{border:1px solid rgba(170,235,255,.45);background:rgba(0,28,57,.72);backdrop-filter:blur(10px);border-radius:18px;padding:7px 12px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.12)}button.pill{color:white}.stats{line-height:1.55}.cast{background:linear-gradient(135deg,rgba(0,113,177,.92),rgba(12,188,221,.9));font-weight:700;font-size:14px;padding:10px 15px}.boat{position:absolute;z-index:7;top:17%;left:50%;width:132px;transform:translateX(-50%);filter:drop-shadow(0 7px 6px rgba(0,0,0,.25));animation:bob 3.1s ease-in-out infinite}.boat svg{display:block;width:100%}@keyframes bob{50%{transform:translate(-50%,4px) rotate(.7deg)}}.fish{position:absolute;z-index:8;width:var(--size);height:auto;filter:drop-shadow(0 4px 5px rgba(0,10,25,.35));will-change:transform;transition:filter .2s}.fish img{display:block;width:100%;pointer-events:none}.fish.rare{filter:drop-shadow(0 0 8px rgba(111,237,255,.8)) drop-shadow(0 4px 5px rgba(0,0,0,.3))}.fish.hit{filter:brightness(1.6) drop-shadow(0 0 14px #fff)}.hookline{position:absolute;z-index:15;height:1.5px;background:rgba(255,247,190,.9);transform-origin:0 50%;pointer-events:none;box-shadow:0 0 3px rgba(255,255,255,.45)}.hook{position:absolute;z-index:16;font-size:18px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 2px 2px #003)}.hint{position:absolute;z-index:20;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,24,50,.54);backdrop-filter:blur(8px);padding:8px 13px;border-radius:18px;color:#bfeeff;font-size:13px}.depth{position:absolute;z-index:4;left:8px;color:rgba(210,245,255,.64);font-size:11px;text-shadow:0 2px 5px #002}.d1{top:28%}.d2{top:47%}.d3{top:67%}.d4{top:84%}.toast{position:absolute;z-index:30;left:50%;top:42%;transform:translate(-50%,-50%);font-weight:800;font-size:18px;color:#fff6a8;text-shadow:0 2px 8px #001b32;opacity:0;pointer-events:none}.toast.show{animation:toast .85s ease}@keyframes toast{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-65px)}}.bubble{position:absolute;border:1px solid rgba(210,250,255,.45);border-radius:50%;z-index:5;animation:rise linear infinite;pointer-events:none}@keyframes rise{to{transform:translateY(-700px);opacity:0}}.tag{position:absolute;z-index:19;right:10px;bottom:58px;font-size:10px;color:#9ddcf5;background:rgba(0,20,42,.6);padding:5px 8px;border-radius:10px}
</style></head><body><main class="game" id="game"><div class="shade"></div><div class="hud"><div class="left"><button class="pill" onclick="location.href='/'">‹ 大廳</button><div class="pill stats"><div>下竿 <b id="count">0</b>/20</div><div>☀️ 晴朗</div></div></div><button class="pill cast" id="castBtn">🎣 下竿！</button></div>
<div class="boat"><svg viewBox="0 0 180 90" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="h" x2="0" y2="1"><stop stop-color="#e54b37"/><stop offset="1" stop-color="#8d1e20"/></linearGradient></defs><path d="M14 57h151l-17 23H35Z" fill="url(#h)" stroke="#661a1a" stroke-width="3"/><path d="M22 55h135l-8-9H34Z" fill="#f7f0de"/><rect x="63" y="22" width="55" height="32" rx="5" fill="#e9f3ef" stroke="#1d5069" stroke-width="3"/><rect x="69" y="28" width="17" height="14" rx="2" fill="#63bde0"/><rect x="91" y="28" width="19" height="14" rx="2" fill="#63bde0"/><rect x="47" y="17" width="10" height="37" rx="2" fill="#394c50"/><path d="M126 52V8" stroke="#72501c" stroke-width="4"/><path d="M128 10l31 10-31 9Z" fill="#f04a38"/><circle cx="42" cy="63" r="10" fill="none" stroke="#ffbd70" stroke-width="5"/><circle cx="140" cy="63" r="10" fill="none" stroke="#ffbd70" stroke-width="5"/></svg></div>
<div class="depth d1">淺層 · 珊瑚礁</div><div class="depth d2">中層 · 岩壁</div><div class="depth d3">深層 · 沉船</div><div class="depth d4">深淵 · 生物光</div><div class="hookline" id="line"></div><div class="hook" id="hook">🪝</div><div class="toast" id="toast"></div><div class="hint" id="hint">👆 點擊水下位置下竿</div><div class="tag">Visual Asset Prototype V1</div></main><script>
const species=[
['sardine','沙丁魚','#a8d7e9','#eafcff','fish',10],['carp','鯉魚','#e65032','#ffbf3d','fish',25],['clownfish','小丑魚','#ff6b19','#fff5dc','clown',35],['mackerel','鯖魚','#2385b8','#d7f4ee','fish',20],['flyingfish','飛魚','#298acb','#9de7ff','wing',45],['dolphin','海豚','#438dbb','#d6f3ff','dolphin',120],['seal','海豹','#735d55','#d8c4b7','seal',85],['bass','鱸魚','#5c8876','#d4e5a7','fish',30],['squid','魷魚','#b94d68','#ffb0a5','squid',40],['shrimp','大蝦','#e76053','#ffb39c','shrimp',35],['jellyfish','水母','#63d9ff','#a678ff','jelly',70],['seahorse','海馬','#e9a33b','#ffdb7d','seahorse',150],['lionfish','獅子魚','#d9472e','#ffd06c','lion',180],['shark','鯊魚','#3d6782','#c7e1e8','shark',100],['turtle','海龜','#527f55','#d4b56b','turtle',90],['blowfish','河豚','#d9a33b','#fff0aa','puffer',60],['swordfish','旗魚','#317cae','#b9efff','sword',220],['octopus','章魚','#bd4d4d','#ff8c72','octopus',50],['crab','螃蟹','#d84b37','#ff9b67','crab',45],['lobster','龍蝦','#bd352c','#ff8a65','lobster',80],['sunfish','翻車魚','#4f91ad','#d5f4f4','sunfish',300],['whale','鯨魚','#315f85','#b6d7e8','whale',200],['manta','蝠鱝','#3d4f83','#9aa9d6','ray',250],['oarfish','皇帶魚','#d8e4e8','#f5d568','oarfish',500],['angler','燈籠魚','#26384a','#8ff6ff','angler',400],['viperfish','蝰魚','#42345c','#df79ff','viper',350]];
function svg(kind,a,b){
 const eye='<circle cx="72" cy="35" r="4.2" fill="#f7ffff"/><circle cx="73" cy="35" r="2.2" fill="#071521"/>';
 const common='<ellipse cx="43" cy="40" rx="34" ry="18" fill="'+a+'"/><path d="M12 40L0 24v32Z" fill="'+b+'"/>'+eye;
 let body=common;
 if(kind==='clown')body=common+'<path d="M36 23v34M54 24v32" stroke="#fff5dc" stroke-width="8"/><path d="M36 23v34M54 24v32" stroke="#2a1a13" stroke-width="1.4"/>';
 if(kind==='shark')body='<path d="M4 42L0 18l18 17Q44 17 80 34l15 8-15 8Q45 64 18 49L0 66l4-24Z" fill="'+a+'"/><path d="M43 29l12-20 8 23Z" fill="'+a+'"/>'+eye;
 if(kind==='turtle')body='<ellipse cx="44" cy="40" rx="29" ry="22" fill="'+a+'" stroke="'+b+'" stroke-width="5"/><ellipse cx="77" cy="39" rx="13" ry="9" fill="'+a+'"/><path d="M30 23L12 8l7 25M30 57L12 72l7-25M57 23L71 9l-5 24M57 57L72 71l-6-24" fill="'+a+'"/>'+eye;
 if(kind==='puffer')body='<circle cx="47" cy="40" r="24" fill="'+b+'"/><g stroke="'+a+'" stroke-width="3">'+Array.from({length:12},(_,i)=>{let q=i*Math.PI/6,x1=47+Math.cos(q)*23,y1=40+Math.sin(q)*23,x2=47+Math.cos(q)*32,y2=40+Math.sin(q)*32;return '<path d="M'+x1+' '+y1+'L'+x2+' '+y2+'"/>';}).join('')+'</g>'+eye;
 if(kind==='ray')body='<path d="M6 39Q38 2 78 34Q55 46 6 39Q38 78 78 46Q55 34 6 39Z" fill="'+a+'"/><path d="M70 40Q92 44 99 68" fill="none" stroke="'+b+'" stroke-width="3"/>'+eye;
 if(kind==='octopus')body='<ellipse cx="48" cy="29" rx="22" ry="20" fill="'+a+'"/><g fill="none" stroke="'+a+'" stroke-width="7" stroke-linecap="round"><path d="M31 43Q18 61 27 72"/><path d="M40 46Q32 65 40 75"/><path d="M50 47Q48 66 53 75"/><path d="M59 44Q70 61 65 72"/></g>'+eye;
 if(kind==='squid')body='<path d="M47 5Q68 24 57 51H36Q25 24 47 5Z" fill="'+a+'"/><g stroke="'+b+'" stroke-width="4" fill="none"><path d="M38 49Q28 65 32 76"/><path d="M45 50Q40 67 45 77"/><path d="M52 50Q57 67 54 77"/><path d="M58 49Q68 65 64 76"/></g>'+eye;
 if(kind==='jelly')body='<path d="M20 40Q25 8 50 8Q75 8 80 40Z" fill="'+a+'" opacity=".9"/><g stroke="'+b+'" stroke-width="3" fill="none"><path d="M28 40Q20 58 28 75"/><path d="M42 40Q34 61 43 78"/><path d="M57 40Q65 60 57 77"/><path d="M70 40Q80 58 70 73"/></g>';
 if(kind==='seahorse')body='<path d="M58 12Q34 9 37 29Q40 42 52 44Q66 47 56 59Q45 72 56 77Q70 82 72 68" fill="none" stroke="'+a+'" stroke-width="10" stroke-linecap="round"/><path d="M50 17l24 3-15 9Z" fill="'+b+'"/>'+eye;
 if(kind==='angler'||kind==='viper')body=common+'<path d="M64 25Q77 5 88 16" fill="none" stroke="'+b+'" stroke-width="2"/><circle cx="90" cy="15" r="5" fill="'+b+'"/><path d="M62 46l6 8 5-9" fill="#fff"/>';
 if(kind==='oarfish')body='<path d="M2 42Q24 24 48 42T96 42" fill="none" stroke="'+a+'" stroke-width="10" stroke-linecap="round"/><path d="M12 35Q35 25 64 34" fill="none" stroke="'+b+'" stroke-width="3"/>'+eye;
 if(kind==='whale'||kind==='dolphin'||kind==='seal')body='<path d="M5 42L0 24l17 12Q45 15 80 31Q94 36 96 42Q91 51 78 54Q42 64 17 48L0 62l5-20Z" fill="'+a+'"/>'+eye;
 if(kind==='sword')body=common+'<path d="M76 40L100 37" stroke="'+b+'" stroke-width="4" stroke-linecap="round"/><path d="M36 23L49 8l8 18Z" fill="'+a+'"/>';
 if(kind==='wing')body=common+'<path d="M34 30L53 7l8 25M34 50l20 22 7-25" fill="'+b+'" opacity=".8"/>';
 if(kind==='sunfish')body='<ellipse cx="50" cy="40" rx="26" ry="31" fill="'+a+'"/><path d="M46 10L56 0l7 13M46 70l10 10 7-13" fill="'+b+'"/><path d="M23 24v32" stroke="'+b+'" stroke-width="8"/>'+eye;
 if(kind==='lion')body=common+'<g stroke="'+b+'" stroke-width="3">'+[18,28,38,48,58].map(x=>'<path d="M'+x+' 24L'+(x-5)+' 5M'+x+' 56L'+(x-5)+' 75"/>').join('')+'</g>';
 if(kind==='crab')body='<ellipse cx="50" cy="42" rx="25" ry="17" fill="'+a+'"/><path d="M25 38L8 25M25 46L7 57M75 38L92 25M75 46L93 57" stroke="'+a+'" stroke-width="7" stroke-linecap="round"/><circle cx="42" cy="36" r="4" fill="#fff"/><circle cx="58" cy="36" r="4" fill="#fff"/>';
 if(kind==='lobster'||kind==='shrimp')body='<path d="M18 43Q38 18 72 37Q58 62 18 43Z" fill="'+a+'"/><path d="M70 37L96 22M70 40L98 48" stroke="'+b+'" stroke-width="3"/><path d="M20 42L3 29v27Z" fill="'+a+'"/>'+eye;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">'+body+'</svg>');
}
const game=document.getElementById('game'), fishes=[]; let casts=0, busy=false, score=0;
function spawn(){
 species.forEach((s,i)=>{const el=document.createElement('div');el.className='fish'+(i>22?' rare':'');const size=(s[4]==='whale'?92:s[4]==='shark'||s[4]==='ray'?78:s[4]==='oarfish'?86:48+Math.random()*18);el.style.setProperty('--size',size+'px');const img=new Image();img.src=svg(s[4],s[2],s[3]);el.appendChild(img);const depth=i<7?[25,43]:i<17?[40,64]:i<23?[57,79]:[72,90];const f={el,s,x:Math.random()*88+6,y:depth[0]+Math.random()*(depth[1]-depth[0]),dir:Math.random()<.5?1:-1,speed:.015+Math.random()*.028,phase:Math.random()*6.28};fishes.push(f);game.appendChild(el);});}
function animate(t){fishes.forEach((f,i)=>{f.x+=f.speed*f.dir;if(f.x>108){f.x=-10;f.dir=1}if(f.x<-12){f.x=106;f.dir=-1}const yy=f.y+Math.sin(t/900+f.phase)*.45;f.el.style.left=f.x+'%';f.el.style.top=yy+'%';f.el.style.transform='translate(-50%,-50%) scaleX('+(f.dir<0?-1:1)+') rotate('+Math.sin(t/700+f.phase)*1.2+'deg)';});requestAnimationFrame(animate)}spawn();requestAnimationFrame(animate);
for(let i=0;i<14;i++){const b=document.createElement('i');b.className='bubble';const z=2+Math.random()*6;b.style.width=b.style.height=z+'px';b.style.left=Math.random()*100+'%';b.style.top=(35+Math.random()*65)+'%';b.style.animationDuration=(7+Math.random()*9)+'s';b.style.animationDelay=(-Math.random()*9)+'s';game.appendChild(b)}
const line=document.getElementById('line'),hook=document.getElementById('hook'),toast=document.getElementById('toast');
function castTo(x,y){if(busy||casts>=20)return;busy=true;casts++;document.getElementById('count').textContent=casts;const rect=game.getBoundingClientRect(),sx=rect.width*.56,sy=rect.height*.19,dx=x-sx,dy=y-sy,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;line.style.left=sx+'px';line.style.top=sy+'px';line.style.width=len+'px';line.style.transform='rotate('+ang+'deg)';hook.style.left=x+'px';hook.style.top=y+'px';line.style.display=hook.style.display='block';let best=null,bd=1e9;fishes.forEach(f=>{const fr=f.el.getBoundingClientRect(),fx=fr.left+fr.width/2-rect.left,fy=fr.top+fr.height/2-rect.top,d=Math.hypot(x-fx,y-fy);if(d<Math.max(30,fr.width*.65)&&d<bd){best=f;bd=d}});setTimeout(()=>{if(best){best.el.classList.add('hit');score+=best.s[5];toast.textContent=best.s[1]+' +'+best.s[5]+' 分';setTimeout(()=>best.el.classList.remove('hit'),400)}else toast.textContent='空鉤…';toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');setTimeout(()=>{line.style.display=hook.style.display='none';busy=false;if(casts>=20){document.getElementById('hint').textContent='本局 '+score+' 分 · 點「大廳」離開或重新整理再玩';}},620)},420)}
game.addEventListener('pointerdown',e=>{if(e.target.closest('.hud'))return;const r=game.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(y<r.height*.21)return;castTo(x,y)});
document.getElementById('castBtn').onclick=()=>{const r=game.getBoundingClientRect();castTo(r.width*(.2+Math.random()*.6),r.height*(.32+Math.random()*.52))};line.style.display=hook.style.display='none';
</script></body></html>
