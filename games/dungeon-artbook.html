<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>礦洞冒險 · 世界畫冊</title><style>
*{box-sizing:border-box}body{margin:0;background:#112329;color:#e4dcc6;font-family:Georgia,'Noto Serif TC',sans-serif}main{max-width:1150px;margin:auto;padding:28px 22px 70px}a{color:#e4c68d}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}h1{color:#e4c68d;letter-spacing:3px;font-size:clamp(24px,4vw,37px);margin:8px 0}p{color:#aebdab;line-height:1.7;margin:0}small{color:#a6bba9}button,select,input{font:inherit;background:#253d37;border:1px solid #70816977;color:#e1d6bc;border-radius:8px;padding:9px 13px}button{cursor:pointer}button.active{background:#d6bb81;color:#203438}input{min-width:0;flex:1}nav{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}#continent{max-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{background:radial-gradient(ellipse at top,#3b4c3e66,transparent 70%),#203731;border:1px solid #a6956533;border-radius:10px;padding:11px;text-align:center;box-shadow:inset 0 1px #e6d5ac0a}.card svg{display:block;width:100%;max-width:160px;margin:0 auto;height:160px}.card h2{font-size:14px;margin:8px 0;color:#e5cf9e}.card small{font-size:11px}.scene-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.scene-grid .card svg{max-width:none;width:100%;height:auto}.hero-grid .card svg{height:200px}.hint{font-size:12px;margin:15px 0;color:#a5b69f}.empty{grid-column:1/-1;padding:30px;text-align:center}footer{margin-top:30px;border-top:1px solid #a6956533;padding-top:15px;font-size:12px;color:#a6b79f}@media(max-width:420px){main{padding-inline:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card svg{height:135px}.scene-grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}@media(prefers-reduced-motion:no-preference){.card:hover svg{transform:translateY(-3px);transition:transform .2s}}
</style></head><body><main><header><div><small>ADVENTURE JOURNAL</small><h1>礦洞冒險 · 世界畫冊</h1><p>從第一把木劍，到踏入虛空的最後一代勇者。</p></div><a href="dungeon.html">進入冒險 →</a></header>
<nav aria-label="畫冊章節"><button data-tab="creatures" class="active">生物圖鑑</button><button data-tab="worlds">九大陸</button><button data-tab="heroes">勇者與傳承</button><button data-tab="items">裝備與道具</button><button data-tab="places">村莊與地標</button></nav>
<div class="toolbar"><input id="search" aria-label="搜尋畫冊" placeholder="搜尋名稱…"><select id="continent" aria-label="選擇大陸"><option value="all">所有大陸</option></select><select id="rarity" aria-label="裝備品質" hidden><option value="white">普通</option><option value="green">精良</option><option value="blue">稀有</option><option value="gold" selected>傳說</option><option value="red">史詩</option></select><select id="element" aria-label="裝備元素" hidden></select></div>
<p class="hint" id="summary" aria-live="polite"></p><div id="gallery" class="grid"></div>
<footer>素材畫冊：可查看造型與配色。遊戲操作與戰鬥請由「進入冒險」體驗。</footer></main>
<script src="assets/dungeon/creatures.js?v=20261004-items"></script><script src="assets/dungeon/objects.js?v=20261004-items"></script><script src="assets/dungeon/art.js?v=20261004-items"></script><script>
const regions=[['forest','新手森林',11],['desert','沙漠遺跡',8],['ice','冰雪荒原',8],['lava','熔岩地獄',8],['sea','深海礦洞',8],['sky','天空浮島',8],['shadow','暗影次元',8],['mech','機械廢都',8],['hidden','隱藏大陸',8]];
const names=Object.keys(DungeonCreatures.recipes),regionByName={};let at=0;for(const [key,label,count]of regions){names.slice(at,at+count).forEach(n=>regionByName[n]=[key,label]);at+=count;const op=document.createElement('option');op.value=key;op.textContent=label;document.getElementById('continent').appendChild(op);}
const controls={search:document.getElementById('search'),continent:document.getElementById('continent'),rarity:document.getElementById('rarity'),element:document.getElementById('element')},gallery=document.getElementById('gallery');let tab='creatures';
for(const [id,e] of Object.entries(DungeonObjects.elementArt)){const op=document.createElement('option');op.value=id;op.textContent=e.name+'元素';controls.element.appendChild(op);}
function card(name,svg,note=''){return `<article class="card">${svg}<h2>${name}</h2><small>${note}</small></article>`;}
function render(){const q=controls.search.value.trim(),rarity=controls.rarity.value,element=controls.element.value;let cards=[];controls.continent.hidden=tab!=='creatures';controls.rarity.hidden=!['items','heroes'].includes(tab);controls.element.hidden=tab!=='items';gallery.className='grid '+(tab==='worlds'?'scene-grid':tab==='heroes'?'hero-grid':'');
if(tab==='creatures')cards=names.filter(n=>(controls.continent.value==='all'||regionByName[n][0]===controls.continent.value)&&n.includes(q)).map(n=>card(n,DungeonArt.monsterSVG(n),regionByName[n][1]));
if(tab==='worlds')cards=regions.filter(r=>r[1].includes(q)).map(([k,label])=>card(label,DungeonArt.sceneSVG(k),'探索、村莊與首領的舞台'));
if(tab==='places')cards=[['inn','旅館'],['merchant','商人營地'],['cave','礦洞入口'],['portal','傳送石'],['chest','寶箱']].filter(x=>x[1].includes(q)).map(([k,n])=>card(n,DungeonObjects.propSVG(k)));
if(tab==='heroes')cards=[['初代礦工','sword',false],['符文法師','wand',true],['重甲勇者','axe',true],['森林遊俠','bow',true],['暗影行者','dagger',true],['長槍衛士','spear',true]].filter(x=>x[0].includes(q)).map(([n,k,armor])=>card(n,DungeonArt.heroSVG({weapon:{subtype:k,rarity},equipment:armor?{helmet:{rarity},armor:{rarity},legs:{rarity},boots:{rarity}}:{}}),'武器與裝備配色隨品質改變'));
if(tab==='items')cards=[['weapon','sword','長劍'],['weapon','axe','戰斧'],['weapon','bow','弓'],['weapon','wand','法杖'],['weapon','dagger','匕首'],['weapon','spear','長槍'],['armor','helmet','頭盔'],['armor','armor','鎧甲'],['armor','legs','護腿'],['armor','gloves','手套'],['armor','boots','靴子'],['armor','ring1','戒指'],['armor','earring1','耳環'],['armor','necklace','項鍊'],['potion','heal_s','小回復藥水'],['potion','int_boost','智慧藥水'],['potion','antidote','解毒藥水'],['scroll','identify','鑑定卷軸'],['scroll','enhance_normal','普通強化卷軸'],['scroll','enhance_lucky','幸運強化卷軸'],['scroll','enhance_holy','神聖強化卷軸'],['scroll','enhance_protect','保護卷軸'],['scroll','enhance_cursed','詛咒強化卷軸'],['scroll','purify','解咒卷軸'],['scroll','teleport_near','回家卷軸'],['scroll','teleport_any','定點傳送卷軸'],['scroll','job_reset','轉職卷軸'],['scroll','job_reincarnate','輪迴卷軸'],['scroll','raid_ticket','副本券'],['scroll','job_exp_up','職業經驗卷軸'],['potion','heal_m','回復藥水'],['potion','heal_l','大回復藥水'],['potion','heal_xl','超級回復藥水'],['potion','heal_full','不死藥'],['potion','str_boost','力量藥水'],['potion','agi_boost','敏捷藥水'],['potion','luk_boost','幸運藥水'],['potion','cure_all','萬能解藥'],['potion','berserk','狂暴藥水'],['potion','invincible','無敵藥水']].filter(x=>x[2].includes(q)).map(([type,subtype,n])=>card(n,DungeonArt.itemSVG({type,subtype,rarity,name:n,element:['weapon','armor'].includes(type)?element:'none'}),['weapon','armor'].includes(type)?DungeonObjects.elementArt[element].name+'元素 · 輪廓、材質與紋章':'功能符號與專屬造型'));
gallery.innerHTML=cards.join('')||'<div class="empty">沒有符合的素材，試試其他名稱。</div>';document.getElementById('summary').textContent=`目前顯示 ${cards.length} 個造型`;
}
for(const b of document.querySelectorAll('[data-tab]'))b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));controls.search.value='';render();});Object.values(controls).forEach(el=>el.addEventListener('input',render));render();
</script></body></html>
